<!-- =============================================================
     Deck_PV.html — the AGG Price & Volume SLIDE CONTENT, in one place.

     Included by TWO files:
       Page_PriceVolume.html   (the report page)
       Page_DeckBuilder.html   (the deck)

     WHAT IT PRODUCES
       'pv'   the composite market slide — KPI strip, the dimension tables,
              and the two waterfall charts down the right (19 of the deck's
              slides come from here: 14 market + 5 customer).
       'cust' the TOP 10 CUSTOMERS slide — MTD over YTD as ONE block, which is
              what the page's own combined export already produces.

     THE EXTRACTION
       Lifted VERBATIM out of Page_PriceVolume.html — copying ~480 lines by
       hand is how transcription bugs get in — with two uniform rewrites:

         STATE.<field>  ->  CTX.<field>
         CONFIG.slide   ->  CTX.slide

       That was safe because the closure was computed first: every function in
       it touches only the 14 context fields listed on ctx_() below. The
       regression harness (tests/regress.js) diffs the page's HTML before and
       after to prove it.

     WHY A MODULE-LEVEL CTX RATHER THAN AN ARGUMENT ON EVERY FUNCTION
       The lifted code reads page state in about thirty places. Threading a
       parameter through all of them would have meant editing all of them, and
       every edit is a chance to change behaviour. Instead the public entry
       points set CTX, call, and restore it. The lifted bodies are untouched,
       so the diff is honest and the harness can actually prove equivalence.

     WHAT STAYED ON THE PAGE
       STATE, CONFIG, the live DOM rendering, data loading, the mapping check,
       the KPI region picker and all UI wiring. Only the slide-content path
       moved.

     CHARTS
       Chart.js only exists in the browser, so the two waterfalls are rendered
       into real canvases and captured to PNG. On the report page those are the
       visible #revChart / #aspChart. The deck has no such canvases, so
       renderChartsOffscreen() makes a throwaway pair, draws and captures them
       — which is why the deck must render slides one at a time. They are NOT
       destroyed until the fitter has run: it knows the frame's real height, so
       it re-photographs both charts at the size the slide actually gives them
       rather than stretching a 500x310 picture into the slot.

     FITTING
       See the block comment above FIT, near the bottom. Short version: the KPI
       strip, the tables and the charts are all grown to fill the frame, and the
       charts are given the width the tables do not need.
     ============================================================= -->
<script>
var AmrPvSlide = (function(){

  /* Page state for the call in flight. Never read this directly from outside;
     go through the entry points at the bottom, which set and restore it. */
  var CTX = {};

  /* Chart colours. They left the page with steps()/waterfall() — nothing else
     there used them. */
  var C = { total:'#011E6A', up:'#2C74CC', down:'#9DC4F0',
            grid:'#E6EEF8', text:'#16243B', muted:'#5C6B82' };

  /* Chart.js instances, keyed by canvas id. The report page reads this too
     (its download-a-single-card button), so it is exported. */
  var charts = {};

  /* Slide geometry. The report page passes its own CONFIG.slide; the deck has
     no CONFIG, so this is what it passes. Same numbers — one authority. */
  var SLIDE = {
    width:  1600, height: 900, padY: 36, padX: 40,
    chartColWidth: 470, columnGap: 22, chartGap: 18,
    chartCaptureW: 500, chartCaptureH: 310,
    html2canvasScale: 3, titleAccent: '#011E6A', scopeFallback: 'Central Canada'
  };

  /* Every context field the lifted code can read. Anything absent is simply
     falsy, which is how the deck gets "no user edits, nothing collapsed". */
  function ctx_(c){
    c = c || {};
    return {
      slide:   c.slide || SLIDE,
      data:    c.data || null,
      period:  c.period || 'MTD',
      month:   c.month || 0,
      latestMonth: c.latestMonth || 0,
      filterField: c.filterField || '',
      filterValue: c.filterValue || '__ALL__',
      /* customer view options */
      cust:    c.cust || null,
      custSecondary: c.custSecondary || 'CUST_SEGMENT',
      custSort: c.custSort || 'cyVol',
      custDir:  c.custDir || 'top',
      custTopN: c.custTopN || '10',
      custSearch: c.custSearch || '',
      collapsed: c.collapsed || {},
      /* the EBITDA workbook strip; {} means "no workbook" and the row is
         simply omitted, exactly as the page behaves today */
      kpi: c.kpi || { vals:null, sheet:'', index:{}, sheets:[], map:{} }
    };
  }

  function withCtx(ctx, fn){
    var prev = CTX;
    CTX = ctx_(ctx);
    try { return fn(); } finally { CTX = prev; }
  }

/* ---------------------------------------------------------------------------
 * Everything below this line was lifted verbatim from Page_PriceVolume.html.
 * Keep it that way: fix bugs here, and let the page delegate.
 * ------------------------------------------------------------------------- */
  var fInt = function(n){ return (Math.round(n||0)).toLocaleString('en-CA'); };

  var fMoney = function(n){ return '$' + fInt(n); };

  var fAsp = function(n){ return '$' + (n||0).toFixed(2); };

  var fPct = function(n){ return ((n||0)*100).toFixed(1) + '%'; };

  var fPctSign = function(n){ var v=(n||0)*100; return (v>=0?'+':'') + v.toFixed(1) + '%'; };

  var fMoneySign = function(n){ return (n>=0?'+':'−') + '$' + fInt(Math.abs(n)); };

  var fT = function(n){ return '$' + (n||0).toFixed(2); };

  var fTSign = function(n){ var v=n||0; return (v>=0?'+$':'−$') + Math.abs(v).toFixed(2); };

  var fPct0 = function(n){ return Math.round((n||0)*100) + '%'; };

  var PV_MONTH_NAMES = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];

  var KPI_FMT = {
    asp: { v:function(n){return n.toFixed(2);}, d:function(n){return n.toFixed(2);}, p:function(n){return (n*100).toFixed(1)+'%';} },
    int: { v:fInt, d:fInt, p:function(n){return Math.round(n*100)+'%';} },
    thou:{ v:function(n){return (n/1000).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });},
           d:function(n){var k=n/1000; return (Math.abs(k)<10 ? k.toFixed(2) : k.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));},
           p:function(n){return Math.round(n*100)+'%';} }
  };

  var connectorPlugin = {
    id:'connector',
    afterDatasetsDraw:function(chart){
      var ctx=chart.ctx, meta=chart.getDatasetMeta(0), seq=chart.$seq, fmt=chart.$fmt;
      if(!meta || !meta.data || !seq || !fmt) return;
      /* the fitter photographs the chart at the size the slide gives it and
         scales the axis fonts with it; the bar labels are drawn here, so they
         have to follow the same scale or they shrink as the chart grows */
      var k = chart.$fscale || 1;
      ctx.save();
      ctx.strokeStyle='#B9C9DF'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
      for(var i=0;i<meta.data.length-1;i++){
        var a=meta.data[i], b=meta.data[i+1];
        ctx.beginPath(); ctx.moveTo(a.x + a.width/2, a.y); ctx.lineTo(b.x - b.width/2, a.y); ctx.stroke();
      }
      ctx.setLineDash([]); ctx.textAlign='center';
      meta.data.forEach(function(bar,i){
        var s=seq[i], top=Math.min(bar.y, bar.base);
        var txt = s.total ? fmt.total(s.value) : fmt.delta(s.value);
        if(s.total){
          // shrink the font until the number fits the bar WIDTH
          var maxW = Math.abs(bar.width) - 8*k, size = 13*k;
          ctx.font = '700 '+size+'px Inter';
          while(ctx.measureText(txt).width > maxW && size > 6){ size -= 0.5; ctx.font='700 '+size+'px Inter'; }
          // must ALSO fit the bar HEIGHT — if the bar is too short, white text would
          // spill onto the white background, so pop it out above the bar in navy.
          var barH = Math.abs(bar.base - bar.y);
          if(barH >= size + 5){
            ctx.fillStyle = '#fff';                 // tall enough: white inside the bar
            ctx.fillText(txt, bar.x, (bar.y + bar.base)/2 + size/3);
          } else {
            ctx.fillStyle = '#011E6A';              // too short: navy, above the bar
            ctx.fillText(txt, bar.x, top - 6*k);
          }
        } else {
          var dmaxW = Math.abs(bar.width)*1.5, dsize = 12.5*k;
          ctx.font='700 '+dsize+'px Inter';
          while(ctx.measureText(txt).width > dmaxW && dsize > 7){ dsize -= 0.5; ctx.font='700 '+dsize+'px Inter'; }
          ctx.fillStyle = s.value>=0 ? '#1F4F8F' : '#7A4750';
          ctx.fillText(txt, bar.x, top-7*k);
        }
      });
      ctx.restore();
    }
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function wrapLabel(str, maxChars){
    var words=str.split(' '), lines=[], cur='';
    words.forEach(function(w){
      if(!cur){ cur=w; }
      else if((cur+' '+w).length<=maxChars){ cur+=' '+w; }
      else { lines.push(cur); cur=w; }
    });
    if(cur) lines.push(cur);
    return lines;
  }

  function pctNote(tag, val){
    return '<div style="font:600 9px Inter;letter-spacing:.02em;text-transform:none;color:#9DC4F0;margin-top:3px">'
      + esc(tag) + ' = ' + fPct0(val) + ' of total</div>';
  }

  function steps(seq){
    var base=[], run=0, fills=[], labels=[], vals=[];
    seq.forEach(function(s){
      labels.push(s.label);
      if(s.total){ base.push([0, s.value]); run=s.value; fills.push(C.total); }
      else { var end=run+s.value; base.push([run, end]); fills.push(s.value>=0?C.up:C.down); run=end; }
      vals.push(s);
    });
    return {labels:labels, data:base, fills:fills, seq:vals};
  }

  function waterfall(canvasId, seq, fmt, yFmt, xOpts){
    var W = steps(seq);
    if(charts[canvasId]) charts[canvasId].destroy();
    var ctx = document.getElementById(canvasId).getContext('2d');
    charts[canvasId] = new Chart(ctx, {
      type:'bar',
      data:{ labels:W.labels, datasets:[{ data:W.data, backgroundColor:W.fills, borderRadius:3, borderSkipped:false, barPercentage:.74, categoryPercentage:.82 }]},
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:450},
        devicePixelRatio: 3,
        layout:{padding:{top:24}},
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(c){ var s=W.seq[c.dataIndex]; return (s.total?fmt.total(s.value):fmt.delta(s.value)); }}}},
        scales:{
          x:{ grid:{display:false}, ticks:{ color:C.muted,
              font:{family:'Inter', size:(xOpts&&xOpts.size)||11, weight:'600'},
              maxRotation:0, autoSkip:false,
              callback:function(v){
                var l=this.getLabelForValue(v).replace(/ \/ /g,'/');
                return (xOpts&&xOpts.maxChars) ? wrapLabel(l, xOpts.maxChars) : l.split(' ');
              } } },
          y:{ grid:{color:C.grid}, ticks:{ color:C.muted, font:{family:'Inter', size:11}, callback:yFmt } , beginAtZero:true}
        }
      },
      plugins:[connectorPlugin]
    });
    charts[canvasId].$seq = W.seq; charts[canvasId].$fmt = fmt;
  }

  /* Blow the axis fonts and the top padding up with the picture, so a chart
     drawn at 700px wide is a BIGGER chart and not the same chart with more
     white in it. Returns the undo. */
  function scaleChartFonts(ch, k){
    var o = ch.options || {};
    var x = o.scales && o.scales.x && o.scales.x.ticks && o.scales.x.ticks.font;
    var y = o.scales && o.scales.y && o.scales.y.ticks && o.scales.y.ticks.font;
    var lay = o.layout && o.layout.padding;
    var prev = { x:x && x.size, y:y && y.size, top:lay && lay.top, f:ch.$fscale };
    if(x) x.size = Math.round((prev.x||11) * k * 10)/10;
    if(y) y.size = Math.round((prev.y||11) * k * 10)/10;
    if(lay) lay.top = Math.round((prev.top||0) * k);
    ch.$fscale = k;
    return function(){
      if(x) x.size = prev.x;
      if(y) y.size = prev.y;
      if(lay) lay.top = prev.top;
      ch.$fscale = prev.f;
    };
  }

  /* fontScale: 1 keeps the chart's own type sizes (what the report page's
     single-card download wants); the slide fitter passes the ratio between the
     size it is drawing at and the module's base capture size. */
  function captureChart(id, w, h, fontScale){
    var ch = charts[id]; if(!ch) return '';
    var k = (fontScale > 0) ? fontScale : 1;
    var sv = { anim:ch.options.animation, dpr:ch.options.devicePixelRatio };
    ch.options.animation = false;
    ch.options.devicePixelRatio = 3;
    var undoFonts = scaleChartFonts(ch, k);
    ch.resize(w, h);
    try { ch.update('none'); } catch(e){}     // the new font sizes need a layout
    try { ch.draw(); } catch(e){}
    var url = ch.toBase64Image('image/png');
    undoFonts();
    ch.options.animation = sv.anim;
    ch.options.devicePixelRatio = sv.dpr;
    ch.resize();
    /* the report page's own canvases are on screen: put the type back the way
       the reader left it, not the way the slide wanted it */
    if(k !== 1){ try { ch.update('none'); } catch(e){} }
    return url;
  }

  function tableInnerHtml(tb){
    var rowsHtml = tb.rows.filter(function(r){
      return r.cyVol || r.pyVol || r.cyAsp || r.pyAsp || r.ppi;  // hide all-zero rows
    }).map(function(r){
      return '<tr><td>'+esc(r.label)+'</td>'
        +'<td class="num">'+fInt(r.cyVol)+'</td><td class="num">'+fInt(r.pyVol)+'</td>'
        +'<td class="num '+(r.volPct>=0?'pos':'neg')+'">'+fPctSign(r.volPct)+'</td>'
        +'<td class="num">'+fAsp(r.cyAsp)+'</td><td class="num">'+fAsp(r.pyAsp)+'</td>'
        +'<td class="num '+(r.aspPct>=0?'pos':'neg')+'">'+fPctSign(r.aspPct)+'</td>'
        +'<td class="num">'+fPct(r.ppi)+'</td></tr>';
    }).join('');
    var t=tb.total;
    return '<table>'
      +'<thead><tr>'
        +'<th>'+esc(tb.dimension)+'</th><th>CY Vol</th><th>PY Vol</th><th>Vol %</th>'
        +'<th class="grp-asp">CY ASP</th><th class="grp-asp">PY ASP</th><th class="grp-asp">ASP % inc</th>'
        +'<th class="grp-ppi">PPI (CY rev)</th>'
      +'</tr></thead>'
      +'<tbody>'+rowsHtml+'</tbody>'
      +'<tfoot><tr><td>Grand total</td>'
        +'<td class="num">'+fInt(t.cyVol)+'</td><td class="num">'+fInt(t.pyVol)+'</td>'
        +'<td class="num '+(t.volPct>=0?'pos':'neg')+'">'+fPctSign(t.volPct)+'</td>'
        +'<td class="num">'+fAsp(t.cyAsp)+'</td><td class="num">'+fAsp(t.pyAsp)+'</td>'
        +'<td class="num '+(t.aspPct>=0?'pos':'neg')+'">'+fPctSign(t.aspPct)+'</td>'
        +'<td class="num">'+fPct(t.ppi)+'</td></tr></tfoot>'
      +'</table>';
  }

  /* The block is built at the module's default size and RE-SIZED by the fitter,
     which knows the frame's real height — it re-photographs the chart at the
     size it hands the picture, so nothing is ever stretched. The classes are
     the fitter's handles. */
  function chartBlockHtml(name, img, id){
    var S = CTX.slide;
    var h = Math.round(S.chartColWidth * S.chartCaptureH / S.chartCaptureW);
    /* data-chart is which canvas this picture came from: the fitter re-shoots
       it, and when one of the two charts fails to capture the surviving block
       is no longer at the index its id sits at. */
    return '<div class="pv-chart-block" data-chart="'+esc(id||'')+'" style="border:1px solid #DCE6F2;border-radius:12px;padding:12px 14px 8px">'
      +'<div class="pv-chart-title" style="font:700 13px Archivo,Arial;color:#011E6A;margin-bottom:4px">'+esc(name)+'</div>'
      +'<img src="'+img+'" style="width:100%;height:'+h+'px;display:block">'
      +'</div>';
  }

  function slideTitle(d){
    var scope = (d.filterValue && d.filterValue!=='__ALL__') ? d.filterValue : CTX.slide.scopeFallback;
    return scope.toUpperCase() + ' PRICE & VOLUME ANALYSIS (' + (d.period==='YTD'?'YTD':'MTD')
         + monthTag_().toUpperCase() + ')';
  }

  function monthTag_(){
    var m = CTX.month || CTX.latestMonth || 0;
    return m ? ' \u00b7 ' + PV_MONTH_NAMES[m-1].slice(0,3) : '';
  }

  function buildPvSlideContent(d){
    var S = CTX.slide;
    /* The page photographs its two visible canvases; the deck has none, so
       renderChartsOffscreen() keeps the ids of its throwaway pair on OFFS.
       Capturing the hardcoded ids here is why deck slides first came out with
       no charts at all. */
    var ids = chartIds();
    var revImg = captureChart(ids[0], S.chartCaptureW, S.chartCaptureH);
    var aspImg = captureChart(ids[1], S.chartCaptureW, S.chartCaptureH);

    var tableCards = (d.tables||[]).map(function(tb){
      var up=tb.volMix>=0;
      return '<div class="card tbl-card" style="break-inside:avoid">'
        +'<div class="card-head"><div><h3>'+esc(tb.dimension)+'</h3></div>'
        +'<div class="right"><span class="badge '+(up?'up':'down')+'"><span class="k">VOL MIX</span>'+fPctSign(tb.volMix)+'</span></div></div>'
        +'<div class="tbl-pad">'+tableInnerHtml(tb)+'</div></div>';
    });
    var tablesArea =
      '<div style="display:flex;flex-direction:column;gap:12px;width:100%">'
      + (tableCards.join('') || '<div style="color:#5C6B82;font:500 13px Inter">No dimensions selected.</div>')
      + '</div>';

    var row = document.createElement('div');
    row.className = 'exp pv-exp-row';
    row.style.cssText = 'width:100%;display:flex;align-items:flex-start;overflow:hidden';
    row.innerHTML =
        '<div class="pv-exp-tables" style="flex:1 1 0%;min-width:0;height:100%;overflow:hidden">'
          +'<div class="pv-exp-tables-inner" style="width:100%;transform-origin:top left">'+tablesArea+'</div>'
        +'</div>'
        +'<div style="width:'+S.columnGap+'px;flex:none"></div>'
        +'<div class="pv-exp-charts" style="width:'+S.chartColWidth+'px;flex:none;display:flex;flex-direction:column;gap:'+S.chartGap+'px">'
          +(revImg?chartBlockHtml('Revenue growth', revImg, ids[0]):'')
          +(aspImg?chartBlockHtml('ASP % growth', aspImg, ids[1]):'')
        +'</div>';
    var kHtml = (typeof kpiCardsHtml==='function') ? kpiCardsHtml() : '';
    if(!kHtml) return row;
    var outer=document.createElement('div');
    outer.style.cssText='width:100%;display:flex;flex-direction:column;height:100%';
    /* Every size inside a KPI card is in em, so the strip's own font-size is
       the one dial the fitter turns: 10px is today's card, and it grows from
       there until the widest card is full. */
    outer.innerHTML =
      '<div class="pv-exp-kpis" style="display:flex;gap:1.1em;flex-wrap:nowrap;width:100%;flex:none;'
      + 'font-size:10px;margin:0 0 ' + FIT.kpiGap + 'px">'
      + kHtml + '</div>';
    outer.appendChild(row);
    return outer;
  }

  function kpiMissingBook(){
    if(String(CTX.filterField||'').toUpperCase()!=='MARKET') return false;
    var v=String(CTX.filterValue||'').trim().toLowerCase();
    if(v!=='manitoba' && v!=='saskatchewan') return false;
    return !(CTX.kpi.vals && CTX.kpi.vals.mbsk);
  }

  function kpiExtract(){
    if(!window.AmrKpi) return null;
    return AmrKpi.plant(CTX.kpi.vals, CTX.kpi.index[CTX.kpi.sheet], CTX.period);
  }

  /* ---- the KPI strip -------------------------------------------------------
     EVERY size below is in em, against the strip's font-size. At 10px the card
     is what it has always been (24px value, 9.5px eyebrow); the fitter raises
     that one number until the widest card fills its share of the slide, so the
     strip grows with the picture instead of staying a 24px row on a 1600px
     slide. Nothing is nudged card by card: they are one row, they scale as one.

     The card CLIPS what overflows (overflow:hidden) rather than spilling over
     its neighbour, and min-width:0 lets the five share the width evenly \u2014 a
     130px floor with nowrap contents is what used to push the last card's
     number off the edge. */
  function kpiCard(eyebrow, pill, cy, py, fmt, grow){
    var d=cy-py, up=d>=0, pct=py?d/py:0;
    var arrow=up?'\u25B2':'\u25BC', col=up?'var(--blue-80)':'var(--neg)';
    var sign=up?'+':'\u2212';
    return kpiCardShell(eyebrow, pill,
        '<div style="display:flex;align-items:baseline;justify-content:flex-start;gap:.8em;margin:.5em 0 .2em">'
          +'<span style="font:800 2.4em Archivo,Arial;color:var(--blue-80);white-space:nowrap">'+fmt.v(cy)+'</span>'
          +'<span style="font:700 1.1em Inter;color:'+col+';white-space:nowrap">'+arrow+' '+sign+fmt.d(Math.abs(d))+' / '+sign+fmt.p(Math.abs(pct))+'</span>'
        +'</div>'
       +'<div style="font:500 1.05em Inter;color:var(--muted);white-space:nowrap">Prior Yr: '+fmt.v(py)+'</div>', grow);
  }

  function kpiCardShell(eyebrow, pill, body, grow){
    return '<div style="flex:'+(grow||1)+' 1 0;min-width:13em;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:1em;box-shadow:var(--shadow);padding:.8em 1.1em">'
      +'<div style="display:flex;flex-direction:column;align-items:flex-start;gap:.4em">'
        +'<span style="font:700 .95em Archivo,Arial;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-100);white-space:nowrap">'+esc(eyebrow)+'</span>'
        +'<span style="background:var(--blue-10);border:1px solid var(--blue-20);color:var(--blue-80);font:700 .8em Archivo,Arial;letter-spacing:.06em;text-transform:uppercase;border-radius:.5em;padding:.25em .75em;white-space:nowrap">'+esc(pill)+'</span>'
      +'</div>'
      + body + '</div>';
  }

  function kpiCardsHtml(){
    if(kpiMissingBook()) return '';
    var x=kpiExtract(); if(!x) return '';
    var d=CTX.data, qv=(d && d.tables && d.tables[0] && d.tables[0].total) || null;
    var ppi=(d && d.priceBridge) ? d.priceBridge.ppi : null;
    var wait='<div style="font:500 1.15em Inter;color:var(--muted);margin-top:1em">Load market data to fill this card.</div>';
    return kpiCard('ASP ($/T)', 'SAP / USGAAP', x.aspCy, x.aspPy, KPI_FMT.asp)
      + (qv ? kpiCard('ASP ($/T)', 'QlikView', qv.cyAsp, qv.pyAsp, KPI_FMT.asp)
            : kpiCardShell('ASP ($/T)', 'QlikView', wait))
      + kpiCard('Total Sales \u2014 Product (K)', 'SAP / USGAAP', x.salesCy, x.salesPy, KPI_FMT.thou)
      + kpiCard('Total Volumes (K)', 'SAP / USGAAP', x.volCy, x.volPy, KPI_FMT.thou)
      + ((ppi!=null)
          ? kpiCardShell('PPI \u2014 CY Revenue', 'Grand total',
              '<div style="margin:.5em 0 .2em;white-space:nowrap"><span style="font:800 2.2em Archivo,Arial;color:var(--blue-100)">'+(ppi*100).toFixed(1)+'</span><span style="font:700 1.2em Inter;color:var(--blue-100)"> %</span></div>'
             +'<div style="font:700 1.05em Inter;color:var(--ink);white-space:nowrap">Price / Product Index</div>')
          : kpiCardShell('PPI \u2014 CY Revenue', 'Grand total', wait));
  }

  function secLabel(s){ return s==='CUST_SEGMENT'?'segment':(s==='PRODUCT_APP'?'application':(s==='SOLD_TO'?'sold-to':'')); }

  function metricLabel(k){ return ({cyVol:'CY volume',pyVol:'PY volume',aspPct:'ASP % inc',ppi:'PPI',deltaApplied:'Δ per applied tonne',cyFsc:'CY fuel surcharge'})[k]||k; }

  function custMetricCells(m){
    return ''
      +'<td class="num grp-vol">'+fInt(m.cyVol)+'</td><td class="num">'+fInt(m.pyVol)+'</td>'
      +'<td class="num '+(m.volPct>=0?'pos':'neg')+'">'+fPctSign(m.volPct)+'</td>'
      +'<td class="num grp-asp">'+fAsp(m.cyAsp)+'</td><td class="num">'+fAsp(m.pyAsp)+'</td>'
      +'<td class="num '+(m.aspPct>=0?'pos':'neg')+'">'+fPctSign(m.aspPct)+'</td>'
      +'<td class="num grp-fsc">'+fMoney(m.cyFsc)+'</td>'
      +'<td class="num grp-ppi">'+fPct(m.ppi)+'</td>'
      +'<td class="num grp-pt '+(m.deltaApplied>=0?'pos':'neg')+'">'+fTSign(m.deltaApplied)+'</td>';
  }

  function custSubtotal(rows){
    var s={cyVol:0,pyVol:0,cyRev:0,pyRev:0,cyRevPpi:0,factorCy:0,cyFsc:0,pyFsc:0,appliedCy:0,appliedPy:0};
    rows.forEach(function(r){
      s.cyVol+=r.cyVol||0; s.pyVol+=r.pyVol||0;
      s.cyRev+=r.cyRev||0; s.pyRev+=r.pyRev||0;
      s.cyRevPpi+=r.cyRevPpi||0; s.factorCy+=r.factorCy||0;
      s.cyFsc+=r.cyFsc||0; s.pyFsc+=r.pyFsc||0;
      s.appliedCy+=r.appliedCy||0; s.appliedPy+=r.appliedPy||0;
    });
    var cyAsp=s.cyVol?s.cyRev/s.cyVol:0, pyAsp=s.pyVol?s.pyRev/s.pyVol:0;
    var cyPerAll=s.cyVol?s.cyFsc/s.cyVol:0, pyPerAll=s.pyVol?s.pyFsc/s.pyVol:0;
    var cyPerApplied=s.appliedCy?s.cyFsc/s.appliedCy:0, pyPerApplied=s.appliedPy?s.pyFsc/s.appliedPy:0;
    return {
      cyVol:s.cyVol, pyVol:s.pyVol, volPct:s.pyVol?(s.cyVol-s.pyVol)/s.pyVol:0,
      cyAsp:cyAsp, pyAsp:pyAsp, aspPct:pyAsp?(cyAsp-pyAsp)/pyAsp:0,
      cyFsc:s.cyFsc, pyFsc:s.pyFsc, appliedCy:s.appliedCy, appliedPy:s.appliedPy,
      ppi:s.cyRevPpi?s.factorCy/s.cyRevPpi:0,
      cyPerAll:cyPerAll, pyPerAll:pyPerAll, cyPerApplied:cyPerApplied, pyPerApplied:pyPerApplied,
      deltaAll:cyPerAll-pyPerAll, deltaApplied:cyPerApplied-pyPerApplied
    };
  }

  function buildCustTable(d){
    var none = CTX.custSecondary==='NONE';
    var sl = secLabel(CTX.custSecondary);
    var segHdr = none ? '' : (sl.charAt(0).toUpperCase()+sl.slice(1));

    var q=(CTX.custSearch||'').trim().toLowerCase();
    var rows=(d.rows||[]).filter(function(r){ return !q || r.label.toLowerCase().indexOf(q)!==-1; });
    var key=CTX.custSort, dir=(CTX.custDir==='bottom')?1:-1;
    rows.sort(function(a,b){ return ((a[key]||0)-(b[key]||0))*dir; });
    var limited=CTX.custTopN!=='all';
    var n=limited?parseInt(CTX.custTopN,10):rows.length;
    if(limited) rows=rows.slice(0,n);

    var grand=d.total||{}, shown=custSubtotal(rows);
    var volShare=grand.cyVol?shown.cyVol/grand.cyVol:0;
    var fscShare=grand.cyFsc?shown.cyFsc/grand.cyFsc:0;
    var rank=(CTX.custDir==='bottom'?'Bottom ':'Top ');

    var SEG_TD='<td style="text-align:left">', SPACER='<span style="display:inline-block;width:14px"></span>';
    var body='';
    rows.forEach(function(r){
      var hasKids=!none && r.children && r.children.length;
      if(!hasKids){
        body+='<tr class="parent" data-key="'+esc(r.label)+'"><td>'+esc(r.label)+'</td>'+(none?'':SEG_TD+'</td>')+custMetricCells(r)+'</tr>'; return;
      }
      if(CTX.collapsed[r.label]){
        body+='<tr class="parent has-kids collapsed" data-key="'+esc(r.label)+'"><td><span class="chev">▾</span> '+esc(r.label)+'</td>'+SEG_TD+'<span style="color:var(--muted)">(all)</span></td>'+custMetricCells(r)+'</tr>';
      } else {
        r.children.forEach(function(c,i){
          body+='<tr class="parent'+(i===0?' has-kids':'')+'" data-key="'+esc(r.label)+'"><td>'+(i===0?'<span class="chev">▾</span> ':SPACER+' ')+esc(r.label)+'</td>'+SEG_TD+esc(c.label||'(blank)')+'</td>'+custMetricCells(c)+'</tr>';
        });
      }
    });

    return '<table class="cust">'
      +'<thead>'
        +'<tr class="grp">'
          +'<th class="sticky-l" rowspan="2">Customer parent</th>'
          +(none?'':'<th rowspan="2">'+esc(segHdr)+'</th>')
          +'<th colspan="3">Volume (tn)'+(limited?pctNote(rank+n, volShare):'')+'</th><th colspan="3">ASP ex-works</th>'
          +'<th rowspan="2" class="grp-fsc">Fuel surcharge ($)'+(limited?pctNote(rank+n, fscShare):'')+'</th>'
          +'<th rowspan="2" class="grp-ppi">PPI</th>'
          +'<th rowspan="2" class="grp-pt">Δ applied surcharge / tonne</th>'
        +'</tr>'
        +'<tr class="col"><th>CY</th><th>PY</th><th>Vol %</th><th>CY</th><th>PY</th><th>ASP % inc</th></tr>'
      +'</thead>'
      +'<tbody>'+body+'</tbody>'
      +'<tfoot><tr><td>All customers total</td>'+(none?'':'<td></td>')+custMetricCells(grand)+'</tr></tfoot>'
      +'</table>';
  }

/* ===========================================================================
 * THE FITTER
 * ---------------------------------------------------------------------------
 * One composition, three parts, all sized from the frame's REAL height and
 * width: the KPI strip across the top, the dimension tables down the left, the
 * two waterfalls down the right.
 *
 * What it is fixing. The old fitter only ever shrank things. The tables were
 * laid out at 13px and left wherever they ended — on a 1030px deck frame the
 * last row landed at 700 and the bottom third of the picture was white. The
 * charts were a fixed 470px column, capped at whatever height that width
 * implied, so they stopped short of the tables. Both are now grown to FILL the
 * frame, which is also what makes the numbers bigger: the cell padding and the
 * header size ride on the table's font-size (see the CSS variables in
 * Deck_Styles.html), so a bigger font is a bigger table, not cramped digits.
 *
 * The rules, in the order they are applied:
 *   1. the KPI strip grows until the widest card is full — never past it, so
 *      nothing clips;
 *   2. the tables take the font that fills the row's height, or the width,
 *      whichever binds first;
 *   3. width the tables did NOT need goes to the charts, up to CHART_MAX;
 *   4. the two charts are re-photographed at exactly the size that fills the
 *      row's height, so the bottom of the lower chart lands on the bottom of
 *      the last table row;
 *   5. anything still short of the bottom is taken up by row padding, not left
 *      as white.
 * ========================================================================= */
  var FIT = {
    kpiGap:  12,                  // strip -> tables, px (mirrored in the markup)
    kpiMin:  8,   kpiMax:  18,    // the strip's font-size dial, px
    tblMin:  9,   tblMax:  26, tblBase: 13,
    padYMin: 0.28, padYMax: 0.85, // table row padding, em of the cell font
    tblComfort: 12,               // below this the tables buy width back off the charts
    /* THE SPLIT. The tables would happily eat the whole row: three stacked
       cards fill 900px of height at ~20px type, and at 20px they want 1150px
       of width, which is the entire slide. So the charts are given their share
       FIRST and the tables are fitted into what is left — that is the "shrink
       the table as long as the numbers still fit" side of the deal. Width the
       tables genuinely do not need still comes back to the charts, up to MAX. */
    chartFrac: 0.36, chartMinFrac: 0.26, chartMaxFrac: 0.46
  };

  /* The strip is one row of equal cards, so the widest card is the constraint.
     Grow the base font until that card would overflow, then stop. Returns the
     strip's height. */
  function fitKpiStrip(strip, availW, availH){
    var cards = [].slice.call(strip.children);
    if(!cards.length) return 0;
    var maxH = Math.max(70, availH * 0.16), best = FIT.kpiMin, f;
    for(f = FIT.kpiMin; f <= FIT.kpiMax + 0.001; f += 0.5){
      strip.style.fontSize = f + 'px';
      var over = strip.scrollWidth > availW + 1 || strip.offsetHeight > maxH;
      for(var i = 0; i < cards.length && !over; i++){
        over = cards[i].scrollWidth > cards[i].clientWidth;   // any clip at all
      }
      if(over) break;
      best = f;
    }
    strip.style.fontSize = best + 'px';
    return strip.offsetHeight;
  }

  /* Everything about a table card that should scale with its numbers. The two
     CSS variables are read by the padding rule in Deck_Styles.html / the page;
     the card head is inline because its rules are px in the shared stylesheet. */
  function applyTableScale(cards, tables, stack, f, padY){
    if(stack) stack.style.gap = Math.round(f * 0.85) + 'px';
    cards.forEach(function(card){
      var head = card.querySelector('.card-head');
      if(head) head.style.padding = Math.round(f*0.62)+'px '+Math.round(f*0.95)+'px '+Math.round(f*0.34)+'px';
      var h3 = card.querySelector('h3');
      if(h3) h3.style.fontSize = (Math.round(f*112)/100) + 'px';
      var badge = card.querySelector('.badge');
      if(badge){
        badge.style.fontSize = (Math.round(f*95)/100) + 'px';
        badge.style.padding  = Math.round(f*0.4)+'px '+Math.round(f*0.85)+'px';
      }
      var k = card.querySelector('.badge .k');
      if(k) k.style.fontSize = (Math.round(f*72)/100) + 'px';
      var pad = card.querySelector('.tbl-pad');
      if(pad) pad.style.padding = '0 '+Math.round(f*0.5)+'px '+Math.round(f*0.6)+'px';
    });
    tables.forEach(function(t){
      t.style.fontSize = f + 'px';
      t.style.setProperty('--tpy', padY + 'em');
      t.style.setProperty('--tpx', '0.7em');
      t.style.setProperty('--thf', '0.86em');
    });
  }

  /* The width the stack would LIKE: every cell is nowrap, so max-content is
     exactly the width at which no number is squeezed.

     The chrome around it is measured off the .tbl-pad's own content box, NEVER
     off the table: a table too wide for its card simply overflows it (the card
     clips, which is how the PPI column used to lose its last digit), so its
     width tells you nothing about the room it has. */
  function cardChrome(card, el){
    if(!card || !el) return 0;
    var cs = getComputedStyle(el);
    var content = el.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0);
    return Math.max(0, card.offsetWidth - content);
  }

  function tablesNeedWidth(cards, tables){
    var w = 0;
    tables.forEach(function(t){
      var pad = t.parentElement, card = pad && pad.parentElement;
      var prev = t.style.width;
      t.style.width = 'max-content';
      var natural = t.offsetWidth;
      t.style.width = prev;
      w = Math.max(w, natural + cardChrome(card, pad));
    });
    cards.forEach(function(card){
      var head = card.querySelector('.card-head');
      if(!head) return;
      var prev = head.style.width;
      head.style.width = 'max-content';      // collapses .right's auto margin
      var natural = head.offsetWidth;        // title + badge + its own padding
      head.style.width = prev;
      w = Math.max(w, natural + (card.offsetWidth - card.clientWidth));   // + border
    });
    return Math.ceil(w);
  }

  /* Grow the tables into colW x rowH. Returns the font it settled on and the
     width it actually needed, which is what buys the charts their extra room. */
  function fitTablesColumn(box, colW, rowH){
    var inner  = box.querySelector('.pv-exp-tables-inner');
    var cards  = [].slice.call(box.querySelectorAll('.tbl-card'));
    var tables = cards.map(function(c){ return c.querySelector('table'); })
                      .filter(function(t){ return !!t; });
    if(!inner || !tables.length) return { font:FIT.tblBase, needW:colW };
    var stack = inner.firstElementChild;

    /* one measurement at the base size, then jump straight to the estimate —
       both the width and the height of a nowrap table are near enough linear
       in the font-size once the padding scales with it */
    applyTableScale(cards, tables, stack, FIT.tblBase, FIT.padYMin);
    var w0 = tablesNeedWidth(cards, tables), h0 = inner.scrollHeight;
    var byW = w0 ? FIT.tblBase * colW / w0 : FIT.tblMax;
    var byH = h0 ? FIT.tblBase * rowH / h0 : FIT.tblMax;
    var f = Math.max(FIT.tblMin, Math.min(FIT.tblMax, Math.floor(Math.min(byW, byH) * 2) / 2));

    var guard = 0;
    applyTableScale(cards, tables, stack, f, FIT.padYMin);
    while(f > FIT.tblMin && guard++ < 40 &&
          (tablesNeedWidth(cards, tables) > colW || inner.scrollHeight > rowH)){
      f -= 0.5; applyTableScale(cards, tables, stack, f, FIT.padYMin);
    }
    guard = 0;
    while(f < FIT.tblMax && guard++ < 40){
      applyTableScale(cards, tables, stack, f + 0.5, FIT.padYMin);
      if(tablesNeedWidth(cards, tables) > colW || inner.scrollHeight > rowH){
        applyTableScale(cards, tables, stack, f, FIT.padYMin); break;
      }
      f += 0.5;
    }

    /* short of the bottom because the WIDTH ran out first: spend what is left
       on the rows rather than leaving a white band under the last card */
    var padY = FIT.padYMin, short = rowH - inner.scrollHeight;
    if(short > 2){
      var rowCount = 0;
      tables.forEach(function(t){ rowCount += t.rows.length; });
      var perEm = Math.max(1, rowCount * 2 * f);          // px added by 1em of padding
      padY = Math.min(FIT.padYMax, padY + short / perEm);
      padY = Math.round(padY * 100) / 100;
      applyTableScale(cards, tables, stack, f, padY);
      guard = 0;
      while(padY > FIT.padYMin && guard++ < 30 && inner.scrollHeight > rowH){
        padY = Math.round((padY - 0.02) * 100) / 100;
        applyTableScale(cards, tables, stack, f, padY);
      }
    }
    return { font:f, needW:tablesNeedWidth(cards, tables) };
  }

  /* The charts fill the row's height exactly, and are RE-PHOTOGRAPHED at that
     size: a chart drawn at 700x420 is a bigger chart, where the same picture
     stretched into the slot would just be a blurrier one. */
  function fitChartColumn(cCol, colW, rowH){
    var blocks = [].slice.call(cCol.querySelectorAll('.pv-chart-block'));
    var imgs = blocks.map(function(b){ return b.querySelector('img'); })
                     .filter(function(i){ return !!i; });
    if(!imgs.length) return;
    var S = CTX.slide, gap = S.chartGap || 18, n = imgs.length;
    cCol.style.gap = gap + 'px';

    var titleF = Math.max(12, Math.min(22, Math.round(colW * 0.031)));
    blocks.forEach(function(b){
      var t = b.querySelector('.pv-chart-title');
      if(t){ t.style.fontSize = titleF + 'px'; t.style.marginBottom = Math.round(titleF*0.35)+'px'; }
      b.style.padding = Math.round(titleF*0.9)+'px '+Math.round(titleF*1.05)+'px '+Math.round(titleF*0.6)+'px';
    });

    var cs = getComputedStyle(blocks[0]);
    var imgW = Math.max(80, Math.floor(blocks[0].clientWidth
                 - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0)));
    var chrome = blocks[0].offsetHeight - imgs[0].offsetHeight;   // border+padding+title
    var imgH = Math.max(80, Math.floor((rowH - gap*(n-1)) / n - chrome));

    /* the type scales with the PICTURE, not with its width alone: these charts
       come out taller and narrower than the module's 500x310 base, and keying
       off the width would have shrunk the labels on a chart that grew */
    var k = Math.sqrt((imgW / (S.chartCaptureW || 500)) * (imgH / (S.chartCaptureH || 310)));
    k = Math.max(0.9, Math.min(1.7, k));

    var ids = chartIds();
    blocks.forEach(function(b, i){
      var im = b.querySelector('img'); if(!im) return;
      im.style.width = imgW + 'px';
      im.style.height = imgH + 'px';
      var url = captureChart(b.getAttribute('data-chart') || ids[i], imgW, imgH, k);
      if(url) im.src = url;
    });
  }

  function pvFitSlide(box){
    try { pvFitSlide_(box); } finally { disposeOffscreen(); }
  }

  function pvFitSlide_(box){
    var S = CTX.slide;
    var center = box.querySelector('.slide-center'); if(!center) return;
    var bodyR = center.parentElement;
    var availH = bodyR.clientHeight, availW = center.clientWidth;
    if(!availH || !availW) return;

    /* fill the frame from the top. The body row centres its content, so a
       block that did not fill the height used to sit in the middle with white
       above AND below it. */
    bodyR.style.alignItems = 'stretch';
    center.style.justifyContent = 'flex-start';

    var rowH = availH;
    var kpiEl = box.querySelector('.pv-exp-kpis');
    if(kpiEl) rowH = availH - fitKpiStrip(kpiEl, availW, availH) - FIT.kpiGap;
    rowH = Math.max(120, rowH);

    var row   = box.querySelector('.pv-exp-row');
    var tBox  = box.querySelector('.pv-exp-tables');
    var inner = box.querySelector('.pv-exp-tables-inner');
    var cCol  = box.querySelector('.pv-exp-charts');
    var hasCharts = !!(cCol && cCol.querySelector('img'));
    if(inner){ inner.style.transform = ''; inner.style.width = '100%'; }
    if(row){
      row.style.height = rowH + 'px'; row.style.overflow = 'hidden';
      /* the row is a flex child of the KPI stack, so it can be shrunk by a
         fraction of a pixel in the strip's height. Fit to what it ACTUALLY
         got, or the tables end up a few pixels taller than the frame and the
         last grand-total row is clipped. */
      rowH = Math.max(120, row.clientHeight || rowH);
    }

    var gap  = S.columnGap || 22;
    var cMin = Math.round(availW * FIT.chartMinFrac);
    var cMax = Math.round(availW * FIT.chartMaxFrac);
    var cWide = Math.max(240, availW - gap - cMin);      // tables at their widest

    /* the charts' share first; the tables get what is left */
    var tW = hasCharts
      ? Math.max(240, availW - gap - Math.round(availW * FIT.chartFrac))
      : availW;
    if(tBox){ tBox.style.flex = 'none'; tBox.style.width = tW + 'px'; }
    var fit = fitTablesColumn(box, tW, rowH);

    if(hasCharts){
      /* too tight to read? then the charts give width back, down to MIN */
      if(fit.font < FIT.tblComfort && tW < cWide){
        tW = cWide;
        tBox.style.width = tW + 'px';
        fit = fitTablesColumn(box, tW, rowH);
      }
      /* and whatever width the tables did not need is the charts' */
      var cW = Math.min(cMax, Math.max(cMin, availW - gap - Math.min(tW, fit.needW)));
      tW = availW - gap - cW;
      if(tBox) tBox.style.width = tW + 'px';
      cCol.style.width = cW + 'px';
      cCol.style.flex = 'none';
      fitTablesColumn(box, tW, rowH);     // settle into the width it ended up with
      fitChartColumn(cCol, cW, rowH);
    }

    /* last resort, for a frame too short for even the smallest font */
    if(inner && inner.scrollHeight > rowH + 1){
      var s = rowH / inner.scrollHeight;
      inner.style.width = Math.round(tW / s) + 'px';
      inner.style.transform = 'scale(' + s + ')';
    }
  }

  function fitCustomerSlide(box){
    box.querySelectorAll('[class*="grp-"]').forEach(function(c){ c.style.boxShadow='none'; });
    var wrap = box.querySelector('.ctbl-wrap');
    var table = box.querySelector('table.cust');
    if(!wrap || !table) return;
    table.style.minWidth = '0';
    var avail = wrap.clientWidth; if(!avail) return;
    var size = 13, guard = 0;
    setCustFont(table, size);
    while(table.scrollWidth > avail + 1 && size > 6.5 && guard < 90){
      size -= 0.5; setCustFont(table, size); guard++;
    }
  }

  function setCustFont(table, size){
    table.style.fontSize = size + 'px';
    [].forEach.call(table.querySelectorAll('td,th'), function(c){ c.style.fontSize = size + 'px'; });
  }

  function fitCombinedCustomerSlide(box){
    box.querySelectorAll('[class*="grp-"]').forEach(function(c){ c.style.boxShadow='none'; });
    var center = box.querySelector('.slide-center'); if(!center) return;
    var bodyR  = center.parentElement;
    var availH = bodyR ? bodyR.clientHeight : 0;

    var tables = [].slice.call(box.querySelectorAll('table.cust'));
    var wraps  = [].slice.call(box.querySelectorAll('.ctbl-wrap'));
    if(!tables.length) return;

    var availW = (wraps[0] && wraps[0].clientWidth) || center.clientWidth;
    if(!availW) return;

    /* stretch each table across the full band so columns + numbers fill the
       horizontal whitespace instead of hugging the left edge */
    tables.forEach(function(t){ t.style.minWidth='0'; t.style.width='100%'; });

    /* grow the number font from a high cap DOWN to the first size that clears
       both the band width (no h-overflow) and the body height. build()'s own
       clamp stays a no-op because we keep height <= availH ourselves. */
    var size = 26, guard = 0;
    setCombinedFont(tables, size);
    function fits(){
      var wOk = tables.every(function(t){ return t.scrollWidth <= availW + 1; });
      var hOk = !availH || center.scrollHeight <= availH + 1;
      return wOk && hOk;
    }
    while(!fits() && size > 7 && guard < 220){ size -= 0.5; setCombinedFont(tables, size); guard++; }
  }

  function setCombinedFont(tables, size){
    var vpad = Math.max(2, Math.round(size*0.24));   // compact rows so the font can climb
    var hpad = Math.max(6, Math.round(size*0.60));
    tables.forEach(function(t){
      t.style.fontSize = size + 'px';
      [].forEach.call(t.querySelectorAll('td,th'), function(c){
        c.style.fontSize      = size + 'px';
        c.style.paddingTop    = vpad + 'px';
        c.style.paddingBottom = vpad + 'px';
        c.style.paddingLeft   = hpad + 'px';
        c.style.paddingRight  = hpad + 'px';
      });
    });
  }

/* ---------------------------------------------------------------------------
 * end of the lifted block
 * ------------------------------------------------------------------------- */

  /* THE LIVE CHART PAIR.
     On the report page these are the two canvases on screen. The deck has no
     canvases, so renderChartsOffscreen() makes a throwaway pair and leaves the
     ids here — module state rather than ctx, because the fitter runs in a
     LATER call with its ctx rebuilt from the row's spec, and it re-photographs
     both charts at the size the frame turns out to give them. */
  var OFFS = null;

  function chartIds(){
    return OFFS ? OFFS.ids : [CTX.revId || 'revChart', CTX.aspId || 'aspChart'];
  }

  function disposeOffscreen(){
    if(!OFFS) return;
    var o = OFFS; OFFS = null;
    o.ids.forEach(function(id){
      if(charts[id]){ try { charts[id].destroy(); } catch(e){} delete charts[id]; }
    });
    if(o.host.parentNode) o.host.parentNode.removeChild(o.host);
  }

  /* Render the two waterfalls into throwaway canvases, for a caller with no
     charts on screen (the deck). They stay alive until the fitter has run —
     it needs them to re-capture at the slide's real size — and that fitter
     disposes of them; a second contentOffscreen() clears any that were left.

     The canvases must be IN the document and have non-zero size or Chart.js
     draws nothing, so they are parked off-screen rather than display:none. */
  function renderChartsOffscreen(d, run){
    disposeOffscreen();
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-99999px;top:0;width:'
      + SLIDE.chartCaptureW + 'px';
    var idR = 'deckRev' + Date.now(), idA = 'deckAsp' + Date.now();
    host.innerHTML =
      '<canvas id="' + idR + '" width="' + SLIDE.chartCaptureW + '" height="' + SLIDE.chartCaptureH + '"></canvas>'
    + '<canvas id="' + idA + '" width="' + SLIDE.chartCaptureW + '" height="' + SLIDE.chartCaptureH + '"></canvas>';
    document.body.appendChild(host);
    OFFS = { host:host, ids:[idR, idA] };
    try {
      renderCharts(d, idR, idA);
      return run(idR, idA);
    } catch(e){
      disposeOffscreen();
      throw e;
    }
  }

  /* The page's renderCharts, parameterised on the canvas ids so the deck can
     point it at its own pair. Defaults are the page's visible canvases. */
  function renderCharts(d, revId, aspId){
    revId = revId || 'revChart'; aspId = aspId || 'aspChart';
    var rb = d.revenueBridge;
    waterfall(revId, [
      {label:'PY Revenue', value:rb.pyRev, total:true},
      {label:'Volume Impact', value:rb.volImpact},
      {label:'Price Impact', value:rb.priceImpact},
      {label:'CY Revenue', value:rb.cyRev, total:true}
    ], { total:fMoney, delta:fMoneySign }, function(v){ return '$'+(v/1e6).toFixed(0)+'M'; });

    var pb = d.priceBridge, seq = [{label:'PPI', value:pb.ppi, total:true}];
    pb.items.forEach(function(it){ seq.push({label:it.label, value:it.value}); });
    seq.push({label:'Total ASP%', value:pb.totalAsp, total:true});
    waterfall(aspId, seq, { total:fPct, delta:fPctSign },
      function(v){ return (v*100).toFixed(0)+'%'; }, { size:9, maxChars:12 });
  }

  /* There is no fitBare any more - the deck photographs the same framed
     slide the pages do, so fitSlide is the only fitter. See the note at the
     bottom of Deck_Fuel.html for why the bare variant made slides worse. */

  /* The TOP 10 CUSTOMERS block. When both periods are loaded and a Top-N is in
     force it is MTD stacked over YTD as ONE block — which is what the page's
     combined export already produces, and what the deck's L_FULL_IMAGE row
     expects. Otherwise it falls back to the single current period.

     Lifted from the page's custSlideSpec(); only the CONTENT moved. The slide
     title, subtitle, margins and filename are the page's PNG-export concern
     and stayed there. */
  function custContent(cd){
    if(!cd) return null;
    var limited = CTX.custTopN !== 'all';

    if(limited && cd.MTD && cd.YTD){
      var combined = document.createElement('div');
      combined.className = 'exp';
      combined.style.cssText = 'width:100%;display:flex;flex-direction:column';
      combined.innerHTML =
          '<div class="cust-blk">'
            +'<div class="cust-blk-lbl" style="font:800 15px Archivo,Arial;color:var(--blue-100);letter-spacing:.04em;margin:0 0 4px 2px">Month to date</div>'
            +'<div class="ctbl-wrap" style="overflow:visible;padding:0">'+buildCustTable(cd.MTD)+'</div>'
          +'</div>'
          +'<div style="flex:none;height:12px"></div>'
          +'<div class="cust-blk">'
            +'<div class="cust-blk-lbl" style="font:800 15px Archivo,Arial;color:var(--blue-100);letter-spacing:.04em;margin:0 0 4px 2px">Year to date</div>'
            +'<div class="ctbl-wrap" style="overflow:visible;padding:0">'+buildCustTable(cd.YTD)+'</div>'
          +'</div>';
      return combined;
    }

    var d = cd[CTX.period]; if(!d) return null;
    var content = document.createElement('div');
    content.className = 'exp';
    content.style.cssText = 'width:100%';
    content.innerHTML =
      '<div class="ctbl-wrap" style="overflow:visible;padding:0">'+buildCustTable(d)+'</div>';
    return content;
  }

  /* =======================================================================
   * KPI region sheets — shared with the Price & Volume page, on purpose
   * ----------------------------------------------------------------------
   * Which EBITDA region sheet a market's KPI cards read is a PER-DEVICE
   * choice, remembered in localStorage under 'pvKpiViewMap' and keyed by the
   * page view (filterField:filterValue). The Deck Builder reads and writes
   * THE SAME map, so a market someone has already set up on the Price &
   * Volume page comes out right in the deck with nothing to redo — and a
   * change made in the deck shows up on that page too.
   * ===================================================================== */
  var KPI_MAP_KEY = 'pvKpiViewMap';

  function kpiLoadMap(){
    try { return JSON.parse(localStorage.getItem(KPI_MAP_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function kpiSaveMap(map){
    try { localStorage.setItem(KPI_MAP_KEY, JSON.stringify(map || {})); } catch(e){}
  }
  /* ONE SLOT PER VIEW, AND LAND / DOCKS ARE THEIR OWN VIEWS.
     This is the report page's own rule, copied exactly (Page_PriceVolume's
     kpiViewKey): the market makes the base key and a refine adds a segment on
     top, so Southwest, Southwest·Land and Southwest·Docks each remember a
     different region sheet. The deck used to drop the refine on the floor, so
     all three of a market's rows shared one slot — set the region on Southwest
     and Land and Docks moved with it — and the two refined rows also read a
     different slot from the one the report page had written for them.

     The PERIOD is deliberately NOT in the key. MTD and YTD of the same view
     read the same region sheet in two places on it, so they move together, and
     that is the one bit of sharing that is wanted. */
  function kpiViewKeyFor(filterField, filterValue, refine){
    var base = (filterField||'') + ':' + (filterValue||'__ALL__');
    var r = String(refine || '').trim() || '__ALL__';
    return (r === '__ALL__') ? base : (base + ':' + r);
  }
  /* Every region sheet the shared workbook offers. [] when no workbook has
     been uploaded, which is exactly when the KPI row is omitted.

     `book` narrows it to one of the two EBITDA workbooks. The report pages
     pass nothing and keep the merged list they have always had; the deck
     passes the book the row's market belongs to, so a Manitoba slide is
     offered Manitoba's region sheets and nothing else. Before this, a MB/SK
     row with only the main workbook uploaded was offered every ONTARIO
     region and defaulted to the first of them - a real region, silently the
     wrong one. It showed no wrong numbers only because kpiMissingBook()
     blanks the strip for those two markets; the moment the MB/SK workbook
     lands that guard stops firing and the stale default would have gone
     straight onto the slide. */
  function kpiSheets(vals, book){
    var list = window.AmrKpi ? AmrKpi.plantIndex(vals, book) : [];
    return (list || []).map(function(e){ return e.label; });
  }
  /* Assemble the ctx.kpi a slide needs: the shared values, the sheet chosen
     for this market, and the index kpiExtract() looks the sheet up in.
     `book` scopes BOTH the offered sheets and the fallback default, so the
     remembered-or-first choice can never land on the other workbook. */
  function kpiFor(vals, filterField, filterValue, override, book, refine){
    var list = window.AmrKpi ? (AmrKpi.plantIndex(vals, book) || []) : [];
    var index = {}, sheets = [];
    list.forEach(function(e){ index[e.label] = e; sheets.push(e.label); });
    var map = kpiLoadMap();
    /* its own slot first; the market's, if it has never been given one; and
       only then the first sheet on the list. A refined view that has not been
       chosen yet should follow its market rather than jump to whatever region
       happens to sort first - that is a real region sheet, silently the wrong
       one, and it looks identical to a deliberate choice. */
    var remembered = map[kpiViewKeyFor(filterField, filterValue, refine)];
    if(remembered === undefined) remembered = map[kpiViewKeyFor(filterField, filterValue)];
    var sheet = (override && sheets.indexOf(override) !== -1) ? override
              : (remembered && sheets.indexOf(remembered) !== -1) ? remembered
              : (sheets[0] || '');
    return { vals:vals || null, sheet:sheet, index:index, sheets:sheets, map:map };
  }
  function kpiRemember(filterField, filterValue, sheet, refine){
    var map = kpiLoadMap();
    map[kpiViewKeyFor(filterField, filterValue, refine)] = sheet;
    kpiSaveMap(map);
  }

  /* =======================================================================
   * public entry points — each sets CTX, does the work, restores it
   * ===================================================================== */
  return {
    SLIDE: SLIDE,
    charts: charts,

    custContent: function(cd, ctx){ return withCtx(ctx, function(){ return custContent(cd); }); },

    kpiSheets: kpiSheets,
    kpiFor: kpiFor,
    kpiRemember: kpiRemember,
    kpiViewKeyFor: kpiViewKeyFor,

    /* used by the report page's own live rendering */
    waterfall: waterfall,
    captureChart: captureChart,
    tableInnerHtml: tableInnerHtml,
    renderCharts: renderCharts,

    monthTag: function(ctx){ return withCtx(ctx, function(){ return monthTag_(); }); },
    slideTitle: function(d, ctx){ return withCtx(ctx, function(){ return slideTitle(d); }); },
    kpiCardsHtml: function(ctx){ return withCtx(ctx, function(){ return kpiCardsHtml(); }); },
    custTableHtml: function(d, ctx){ return withCtx(ctx, function(){ return buildCustTable(d); }); },

    /* the composite market block. Charts must already be on screen — the page
       has them; the deck should use contentOffscreen instead. */
    content: function(d, ctx){ return withCtx(ctx, function(){ return buildPvSlideContent(d); }); },

    /* the deck's version: render the charts, build the block, clean up */
    contentOffscreen: function(d, ctx){
      return withCtx(ctx, function(){
        return renderChartsOffscreen(d, function(){ return buildPvSlideContent(d); });
      });
    },

    fitSlide: function(box, ctx){ return withCtx(ctx, function(){ return pvFitSlide(box); }); },
    fitCustomerSlide: fitCustomerSlide,
    fitCombinedCustomerSlide: fitCombinedCustomerSlide
  };
})();


/* ===========================================================================
 * Deck Builder adapters — registered ONLY on the Deck Builder page.
 * ---------------------------------------------------------------------------
 * The Price & Volume page includes this file too but never creates
 * AmrDeckSource, so nothing below runs there.
 *
 *   'pv'    one market x one period -> the composite slide
 *   'cust'  one market, BOTH periods -> the Top 10 block
 *
 * Reports are cached per market+period, so the 14 market slides and the 5
 * customer slides between them cost one server call each, not one per slide.
 * ========================================================================= */
(function(){
  if(!window.AmrDeckSource) return;

  var RPT = {};      // 'market|period'  -> getReport payload
  var CUST = {};     // 'market|period'  -> getCustomerReport payload
  var KPIVALS = { loaded:false, vals:null };

  function srv(fn, args){
    return new Promise(function(resolve, reject){
      if(typeof google==='undefined' || !google.script || !google.script.run){
        return reject(new Error('Price & Volume data needs the live web app.'));
      }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn]
        .apply(null, args || []);
    });
  }

  /* '__ALL__' is how the backend spells "every market" — the deck's
     "Central Canada" rollup is exactly that, and it has no market tab. */
  function isCentral(market){
    var m = String(market || '').trim();
    return !m || /^central\s*canada$/i.test(m);
  }
  function filterValueOf(market){
    return isCentral(market) ? '__ALL__' : String(market || '').trim();
  }

  /* Which EBITDA workbook this row's KPI strip reads. Central Canada is a
     rollup of both books; it is left on 'main', which is where its region
     sheets are and what it has always used. */
  function bookOf(spec){
    return (window.AmrKpi && AmrKpi.bookFor)
      ? AmrKpi.bookFor(spec && spec.market) : 'main';
  }

  /* WHICH BREAKDOWN THE FIRST TABLE SHOWS.
     Inside one market the interesting cut is its submarkets. Central Canada is
     not a market — it is every market at once — so cutting it by submarket
     produced one flat list of fourteen submarkets from five different markets
     (West GTA next to Regina next to Sask AGG) and the reader had to reassemble
     the markets in their head. The rollup slide is cut by MARKET. */
  function dimsFor(market){
    return isCentral(market) ? ['MARKET', 'PLANT_TYPE', 'PROD_CLASS']
                             : ['SUBMARKET1', 'PLANT_TYPE', 'PROD_CLASS'];
  }

  /* ---- LAND / DOCKS ------------------------------------------------------
     Southwest Land and Southwest Docks are NOT markets. They are the two
     values of the MB SUBMARKET column inside the Southwest market, which the
     Price & Volume page exposes as its refine chips. Asking the backend to
     filter MARKET = "Southwest Land" matched no row at all, so both slides
     were published as a full page of zeroes rather than failing out loud.

     A recipe row therefore says market:'Southwest', refine:'Land'. The raw
     value spelled in the sheet ("SW Land", "SW DOCKS", whatever it is this
     month) is never written down here: the unrefined report already returns
     refineOptions for the market, so the label is matched against that list at
     build time, exactly as the chips on the page do it. */
  function refineLabelOf(v){ return /dock/i.test(String(v || '')) ? 'Docks' : 'Land'; }

  function resolveRefine(spec){
    var want = String(spec.refine || '').trim();
    if(!want) return Promise.resolve('__ALL__');
    /* the market's own report, unrefined - it carries the option list */
    return loadReport({ market: spec.market, period: spec.period }).then(function(d){
      var opts = (d && d.refineOptions) || [];
      for(var i = 0; i < opts.length; i++){
        if(refineLabelOf(opts[i]).toLowerCase() === want.toLowerCase()) return opts[i];
      }
      throw new Error('"' + want + '" is not one of the Land / Docks values in '
        + (spec.market || 'this market') + '. The sheet’s MB SUBMARKET column offers: '
        + (opts.join(', ') || '(none)') + '.');
    });
  }

  /* The shared EBITDA values, once per session. A missing workbook is NOT an
     error: the KPI row is simply omitted, exactly as the page behaves. */
  function loadKpi(){
    if(KPIVALS.loaded) return Promise.resolve(KPIVALS.vals);
    if(!window.AmrKpi){ KPIVALS.loaded = true; return Promise.resolve(null); }
    return new Promise(function(resolve){
      try {
        AmrKpi.load(function(vals){
          KPIVALS.loaded = true; KPIVALS.vals = vals || null; resolve(KPIVALS.vals);
        });
      } catch(e){ KPIVALS.loaded = true; resolve(null); }
    });
  }

  /* The refine value belongs in the key: Southwest, Southwest·Land and
     Southwest·Docks are three different reports off the same market. */
  /* The month is part of the key too: July and August are different reports off
     the same market, and the deck can be built for either. */
  function monthOf(spec){
    var m = Number(spec && spec.month) || 0;
    return (m >= 1 && m <= 12) ? m : 0;          // 0 = let the backend decide
  }
  function reportKey(spec, refineValue){
    return filterValueOf(spec.market) + '|' + (spec.period || 'MTD')
         + '|' + (refineValue || '__ALL__') + '|m' + monthOf(spec);
  }

  function loadReport(spec, refineValue){
    var rv = refineValue || '__ALL__';
    var key = reportKey(spec, rv);
    if(RPT[key]) return Promise.resolve(RPT[key]);
    return srv('getReport', [{
      period: spec.period || 'MTD',
      dimensions: dimsFor(spec.market),
      filterField: 'MARKET',
      filterValue: filterValueOf(spec.market),
      refineValue: rv,
      refineMode: 'include',
      month: monthOf(spec),     // 0 = the server's report month (last closed)
      upload: null
    }]).then(function(d){
      if(!d) throw new Error('No Price & Volume data for ' + (spec.market || 'Central Canada') + '.');
      RPT[key] = d; return d;
    });
  }

  /* What a spec actually resolves to, cached per row so prepare() and content()
     agree without a second round trip. */
  var REFINED = {};
  function refineCacheKey(spec){
    return spec.id
      || (filterValueOf(spec.market) + '|' + (spec.period||'') + '|' + (spec.refine||''));
  }
  function specRefine(spec){
    var k = refineCacheKey(spec);
    if(REFINED[k] != null) return Promise.resolve(REFINED[k]);
    return resolveRefine(spec).then(function(rv){ REFINED[k] = rv; return rv; });
  }

  function custKey(spec, period){
    return filterValueOf(spec.market) + '|' + period + '|m' + monthOf(spec);
  }
  function loadCust(spec, period){
    var key = custKey(spec, period);
    if(CUST[key]) return Promise.resolve(CUST[key]);
    return srv('getCustomerReport', [{
      period: period, secondary: 'CUST_SEGMENT',
      market: filterValueOf(spec.market), month: monthOf(spec), upload: null
    }]).then(function(d){ CUST[key] = d; return d; });
  }

  /* The ctx a slide is rendered with. spec.kpiSheet is the per-row override
     the Deck Builder's Region dropdown sets; absent, the remembered per-device
     choice wins, then the first sheet. */
  function ctxFor(spec, d){
    var fv = filterValueOf(spec.market);
    return {
      slide: AmrPvSlide.SLIDE,
      data: d || null,
      period: spec.period || 'MTD',
      month: monthOf(spec), latestMonth: (d && d.latestMonth) || 0,
      filterField: 'MARKET', filterValue: fv,
      custSecondary: 'CUST_SEGMENT', custSort: 'cyVol', custDir: 'top',
      custTopN: '10', custSearch: '', collapsed: {},
      kpi: AmrPvSlide.kpiFor(KPIVALS.vals, 'MARKET', fv, spec.kpiSheet, bookOf(spec), spec.refine)
    };
  }

  AmrDeckSource.register('pv', {
    /* Both the report and the KPI workbook; the KPI half never fails the
       slide, it just leaves the strip off. A Land / Docks row resolves its
       refine value first — that is one extra report for the market, which the
       market's own slides then reuse from cache. */
    prepare: function(spec){
      return specRefine(spec).then(function(rv){
        return Promise.all([loadReport(spec, rv), loadKpi()]);
      });
    },
    /* The Region dropdown needs the KPI workbook, and it is worth knowing
       which rows have one BEFORE spending a render on the wrong region. Only
       the KPI half: the reports themselves are per row and stay in prepare(). */
    warm: function(){ return loadKpi(); },
    content: function(spec){
      /* prepare() always runs first, so the resolved refine is in hand. */
      var d = RPT[reportKey(spec, REFINED[refineCacheKey(spec)])];
      if(!d) throw new Error('Price & Volume data is not loaded yet.');
      var el = AmrPvSlide.contentOffscreen(d, ctxFor(spec, d));
      if(!el) throw new Error('Could not build the Price & Volume block.');
      return el;
    },
    /* the page's fitSlide, on the page's frame, with this row's ctx */
    fit: function(box, spec){
      var d = RPT[reportKey(spec, REFINED[refineCacheKey(spec)])] || null;
      return AmrPvSlide.fitSlide(box, ctxFor(spec, d));
    },
    /* The Deck Builder shows a Region dropdown on rows whose source declares
       one. Everything it needs is here, so the page stays generic — including
       WHICH workbook this row reads, so the page never has to know that
       Manitoba and Saskatchewan are the ones on the second file. */
    kpiPicker: {
      sheets: function(spec){ return AmrPvSlide.kpiSheets(KPIVALS.vals, bookOf(spec)); },
      current: function(spec){
        return AmrPvSlide.kpiFor(KPIVALS.vals, 'MARKET',
          filterValueOf(spec.market), spec.kpiSheet, bookOf(spec), spec.refine).sheet;
      },
      /* keyed by market AND refine, so this dropdown is this row's - and its
         MTD / YTD twin's, which reads the same sheet - and nobody else's */
      choose: function(spec, sheet){
        AmrPvSlide.kpiRemember('MARKET', filterValueOf(spec.market), sheet, spec.refine);
      },
      book: bookOf,
      hasBook: function(spec){
        return !(window.AmrKpi && AmrKpi.hasBook)
            || AmrKpi.hasBook(KPIVALS.vals, bookOf(spec));
      }
    },
    /* ↻ Update from source: drop everything fetched, so the next Render asks
       the server again instead of re-photographing the copy in memory. */
    reset: function(){
      RPT = {}; CUST = {}; REFINED = {};
      KPIVALS.loaded = false; KPIVALS.vals = null;
    }
  });

  AmrDeckSource.register('cust', {
    prepare: function(spec){
      return Promise.all([loadCust(spec, 'MTD'), loadCust(spec, 'YTD')]);
    },
    content: function(spec){
      var cd = { MTD: CUST[custKey(spec, 'MTD')], YTD: CUST[custKey(spec, 'YTD')] };
      if(!cd.MTD && !cd.YTD) throw new Error('Customer data is not loaded yet.');
      var el = AmrPvSlide.custContent(cd, ctxFor(spec, null));
      if(!el) throw new Error('Could not build the customer block.');
      return el;
    },
    fit: AmrPvSlide.fitCombinedCustomerSlide,
    /* Same store as 'pv' above — clearing it twice is harmless and means
       neither adapter depends on the other being registered. */
    reset: function(){
      RPT = {}; CUST = {}; REFINED = {};
      KPIVALS.loaded = false; KPIVALS.vals = null;
    }
  });
})();
</script>
