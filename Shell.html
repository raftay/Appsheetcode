<!-- ================================================================== -->
<!-- Shell.html — shared UI injected into EVERY page.                    -->
<!-- Add it just before the closing body tag via include('Shell').         -->
<!--                                                                    -->
<!-- It provides, with zero changes to each page's own code:            -->
<!--   • the Settings + Help + per-table-hint modals                    -->
<!--   • window.amrGoHome() / amrOpenHelp() / amrOpenSettings()         -->
<!--     so each page's TOP NAV bar can host Home / Help / Data sheet    -->
<!--   • AmrHint: a "?" next to each table with its source-tab layout   -->
<!--   • a PAGE-SWITCHER dropdown auto-injected into the header bar     -->
<!--     (jump between tools without going through the landing page)    -->
<!--   • AmrKpiStore: a per-device store for uploaded KPI workbooks —   -->
<!--     upload once on any page, every page that uses the same key     -->
<!--     reads it back, and it survives refreshes.                      -->
<!-- (The floating toolbar was removed — those actions now live in each  -->
<!--  page's header. The whitespace slider + slide export live in        -->
<!--  SlideExport.html as AmrSlide.)                                     -->
<!--                                                                    -->
<!-- Each page sets three globals before including this file:           -->
<!--   window.APP_URL  = '<?= appUrl ?>'   (the web-app /exec URL)       -->
<!--   window.APP_PAGE = 'pricevolume' | 'rmx' | 'slidebuilder' | 'fuelsurcharge' | 'landing'
<!--   window.HELP_HTML = '...'            (this page's help content)    -->
<!-- All shell CSS/classes are prefixed `amr-` so they never clash with -->
<!-- a page's own styles.                                               -->
<!-- ================================================================== -->
<style>
/* modal */
.amr-modal{position:fixed;inset:0;z-index:9100;display:none;align-items:center;justify-content:center;
  background:rgba(1,30,106,.34);padding:20px}
.amr-modal.amr-open{display:flex}
.amr-card{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:86vh;overflow:auto;
  box-shadow:0 24px 60px rgba(1,30,106,.30)}
.amr-card .amr-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #EEF3F9;
  position:sticky;top:0;background:#fff}
.amr-card .amr-head h2{font:800 17px Archivo,sans-serif;margin:0;color:#011E6A;flex:1}
.amr-x{border:0;background:#EEF7FF;color:#011E6A;width:30px;height:30px;border-radius:8px;cursor:pointer;
  font:700 16px Inter;line-height:1}
.amr-body{padding:20px 22px;font:400 13.5px Inter,sans-serif;color:#16243B;line-height:1.55}
.amr-body h3{font:700 13px Archivo,sans-serif;margin:18px 0 6px;color:#011E6A}
.amr-body h3:first-child{margin-top:0}
.amr-body code{background:#EEF7FF;border-radius:5px;padding:1px 5px;font-size:12px}
.amr-body table{border-collapse:collapse;width:100%;margin:8px 0 4px;font-size:12px}
.amr-body th{background:#011E6A;color:#fff;text-align:left;padding:6px 8px;font-weight:600;white-space:nowrap}
.amr-body td{border:1px solid #DCE6F2;padding:5px 8px;white-space:nowrap}
.amr-scroll{overflow-x:auto}
.amr-input{width:100%;border:1px solid #DCE6F2;border-radius:10px;background:#F4F7FC;padding:10px 12px;
  font:500 13px Inter;color:#16243B}
.amr-save{margin-top:0;border:0;background:#011E6A;color:#fff;font:700 13px Inter;padding:10px 18px;
  border-radius:10px;cursor:pointer}
.amr-save:hover{background:#0404BD}
.amr-save:disabled{opacity:.55;cursor:default}
.amr-status{margin-top:10px;font:600 12px Inter}
.amr-status.ok{color:#1F7A4D}.amr-status.err{color:#B23A48}.amr-status.muted{color:#5C6B82}
.amr-cur{background:#EEF7FF;border:1px solid #D7E9FB;border-radius:10px;padding:10px 12px;font:500 12.5px Inter;
  color:#16243B;margin-bottom:10px;word-break:break-word}
.amr-set-row{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid #EEF3F9}
.amr-set-row:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.amr-default-link{font:600 12px Inter;color:#5C6B82;text-decoration:none}
.amr-default-link:hover{color:#0F4FD6}

/* little "?" button shown next to each generated table */
.amr-qm{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  border:1px solid #C7DEF8;background:#EEF7FF;color:#0F4FD6;font:700 12px Inter,sans-serif;cursor:pointer;
  line-height:1;padding:0;vertical-align:middle}
.amr-qm:hover{background:#fff;border-color:#24A0FF}

/* page-switcher dropdown (sits on the navy header bar, styled like .ghost) */
/* NOTE: Styles.html sets a global `select{width:100%}`, so width + flex are
   pinned here or the dropdown stretches across the whole header. */
.amr-pageSel{appearance:none;-webkit-appearance:none;
  flex:0 0 auto;width:auto;max-width:180px;box-sizing:border-box;
  border:1px solid rgba(255,255,255,.28);
  background-color:transparent;color:#fff;font:600 12px Inter;
  padding:7px 26px 7px 12px;border-radius:9px;cursor:pointer;transition:.15s;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center}
.amr-pageSel:hover{background-color:rgba(255,255,255,.12)}
.amr-pageSel option{color:#16243B;background:#fff}
/* fallback pill used only if a page has no header.bar */
.amr-pageSel.amr-float{position:fixed;top:14px;right:16px;z-index:9050;
  background-color:#011E6A;box-shadow:0 8px 24px rgba(1,30,106,.35)}
</style>

<!-- Help modal -->
<div class="amr-modal" id="amrHelpModal">
  <div class="amr-card">
    <div class="amr-head"><h2 id="amrHelpTitle">How to use this page</h2>
      <button class="amr-x" data-close="amrHelpModal">&times;</button></div>
    <div class="amr-body" id="amrHelpBody"></div>
  </div>
</div>

<!-- Settings modal -->
<div class="amr-modal" id="amrSetModal">
  <div class="amr-card">
    <div class="amr-head"><h2 id="amrSetTitle">Data source &middot; Google Sheet</h2>
      <button class="amr-x" data-close="amrSetModal">&times;</button></div>
    <div class="amr-body">
      <p style="margin-top:0" id="amrSetIntro">This tool reads from its own Google Sheet.
        Paste its link below and click Save.</p>
      <div id="amrSetList">
        <div class="amr-cur">Checking current setting&hellip;</div>
      </div>
    </div>
  </div>
</div>

<!-- Per-table source hint modal -->
<div class="amr-modal" id="amrHintModal">
  <div class="amr-card">
    <div class="amr-head"><h2>Source data for this table</h2>
      <button class="amr-x" data-close="amrHintModal">&times;</button></div>
    <div class="amr-body" id="amrHintBody"></div>
  </div>
</div>

<script>
(function(){
  var IS_LIVE = (typeof google !== 'undefined' && google.script && google.script.run);
  var PAGE = window.APP_PAGE || 'landing';
  var URL  = window.APP_URL  || '';

  /* Navigate the TOP window (we live inside an Apps Script sandbox iframe,
     so a normal location change won't work — an _top anchor does). */
  function navTop(href){
    var a=document.createElement('a'); a.href=href; a.target='_top';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 1500);
  }
  window.amrNavTop = navTop;

  /* Reload the page the user is currently on (so it re-reads its sheet). */
  function reloadThisPage(){
    var sep = (PAGE && PAGE!=='landing') ? ('?page='+PAGE+'&') : '?';
    navTop(URL + sep + 'r=' + Date.now());
  }

  /* ---- top-nav helpers (each page's header calls these) ---- */
  window.amrGoHome = function(){ navTop(URL); };

  /* ================== Page switcher ==================
   * One dropdown on every tool page: pick a page, land on it directly —
   * no round-trip through the landing page. Injected into the header bar
   * right after the brand block; if a page has no header.bar it floats
   * top-right instead. The landing page itself doesn't get one (it IS
   * the page picker).
   * To add a page: add a line to AMR_PAGES (value = its ?page= key). */
  var AMR_PAGES = [
    { p:'landing',         label:'Home' },
    { p:'overview',        label:'Overview' },
    { p:'pricevolume',     label:'AGG - Price & Volume' },
    { p:'rmx',             label:'RMX - Price & Volume' },
    { p:'segment',         label:'RMX - Product Segment' },
    { p:'fuelsurcharge',   label:'AGG - Fuel Recovery' },
    { p:'rmxfuel',         label:'RMX - Fuel Recovery' },
    { p:'tp01',            label:'AGG - Transfer Price' },
    { p:'inventoryreport', label:'Inventory Report' },
    { p:'deckbuilder',     label:'Deck Builder' }
  ];
  function mountPageSwitcher(){
    if(PAGE==='landing' || !URL) return;
    var sel=document.createElement('select');
    sel.className='amr-pageSel';
    sel.title='Switch to another tool';
    sel.setAttribute('aria-label','Switch page');
    sel.innerHTML = AMR_PAGES.map(function(x){
      return '<option value="'+x.p+'"'+(x.p===PAGE?' selected':'')+'>'+x.label+'</option>';
    }).join('');
    sel.addEventListener('change', function(){
      var p=this.value;
      if(p===PAGE) return;
      navTop(p==='landing' ? URL : URL + '?page=' + p);
    });
    /* RMX uses a plain navy <header> (no .bar class) — accept either */
    var bar=document.querySelector('header.bar') || document.querySelector('header');
    if(bar){
      var brand=bar.querySelector('.brand') || bar.firstElementChild;
      if(brand && brand.nextSibling) bar.insertBefore(sel, brand.nextSibling);
      else bar.insertBefore(sel, bar.firstChild);
    } else {
      sel.classList.add('amr-float');
      document.body.appendChild(sel);
    }
  }
  if(document.readyState!=='loading') mountPageSwitcher();
  else document.addEventListener('DOMContentLoaded', mountPageSwitcher);

  /* ---- Help modal ---- */
  function openHelp(){
    document.getElementById('amrHelpBody').innerHTML = window.HELP_HTML || '<p>No help for this page yet.</p>';
    document.getElementById('amrHelpModal').classList.add('amr-open');
  }
  window.amrOpenHelp = openHelp;

  /* ================== Settings modal (per-page data sources) ==================
   * On a specific page: shows just THAT page's Google Sheet.
   * On the Landing page: shows every page's sheet, each editable.
   * Defaults are set in code (Config.gs); a saved override wins over the default.
   */
  var setModal = document.getElementById('amrSetModal');
  var setList  = document.getElementById('amrSetList');
  var setIntro = document.getElementById('amrSetIntro');
  var setTitle = document.getElementById('amrSetTitle');

  function esc(x){ return String(x==null?'':x).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function escAttr(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  function sourceBadge(s){
    if(s==='override') return '<span style="color:#1F7A4D;font-weight:700">saved override</span>';
    if(s==='code')     return '<span style="color:#5C6B82">code default</span>';
    if(s==='legacy')   return '<span style="color:#5C6B82">legacy shared sheet</span>';
    return '<span style="color:#B23A48;font-weight:700">not set</span>';
  }

  /* Build one editable row for a page's settings object. */
  function renderRow(s){
    var head = s.configured
      ? '<b>'+esc(s.label)+'</b> &middot; reading <b>'+esc(s.name||'(sheet)')+'</b> &middot; '+sourceBadge(s.source)+
        (s.url?' &middot; <a href="'+escAttr(s.url)+'" target="_blank" style="color:#0F4FD6">open</a>':'')
      : '<b>'+esc(s.label)+'</b> &middot; '+sourceBadge(s.source)+(s.error?'<br><span style="color:#B23A48">'+esc(s.error)+'</span>':'');
    var canDefault = (s.source==='override');
    var hint = s.hint
      ? '<div style="margin:-4px 0 8px;font:500 12px Inter,Arial;color:#5C6B82;line-height:1.5">'+esc(s.hint)+'</div>'
      : '';
    return ''+
      '<div class="amr-set-row" data-page="'+escAttr(s.page)+'">'+
        '<div class="amr-cur">'+head+'</div>'+ hint +
        '<input class="amr-input amr-sheet-input" type="text" value="'+escAttr(s.url||s.spreadsheetId||'')+'" '+
          'placeholder="https://docs.google.com/spreadsheets/d/XXXXXXXX/edit">'+
        '<div style="margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+
          '<button class="amr-save amr-save-btn">Save &amp; reload</button>'+
          (canDefault?'<a href="#" class="amr-default-link">Use code default</a>':'')+
          '<span class="amr-status muted amr-row-status" style="margin-top:0"></span>'+
        '</div>'+
      '</div>';
  }

  function fillError(msg){ setList.innerHTML = '<div class="amr-cur">'+esc(msg)+'</div>'; }

  function openSettings(){
    setModal.classList.add('amr-open');
    if(!IS_LIVE){ fillError('Settings can only be changed inside the live web app.'); return; }
    setList.innerHTML = '<div class="amr-cur">Checking current setting&hellip;</div>';

    if(PAGE==='landing'){
      setTitle.textContent = 'Data sources \u00B7 Google Sheets';
      setIntro.textContent = 'Each tool reads from its own Google Sheet. Update any of them below.';
      google.script.run
        .withSuccessHandler(function(list){ setList.innerHTML = (list||[]).map(renderRow).join(''); })
        .withFailureHandler(function(e){ fillError('Could not read settings: '+(e&&e.message||e)); })
        .getAllSettings();
    } else {
      setTitle.textContent = 'Data source \u00B7 Google Sheet';
      setIntro.textContent = 'This tool reads from its own Google Sheet. Paste its link below and click Save.';
      /* getSettingsFor returns this page's own sheet plus any extra source it
         reads (Price & Volume and Fuel Recovery both also read the
         Saskatchewan increase sheet), so a page can list more than one. */
      google.script.run
        .withSuccessHandler(function(list){
          var rows = [].concat(list || []);
          if(!rows.length){ fillError('No data source is configured for this page.'); return; }
          if(rows.length > 1){
            setTitle.textContent = 'Data sources \u00B7 Google Sheets';
            setIntro.textContent = 'This tool reads from the sheets below. Paste a link and click Save.';
          }
          setList.innerHTML = rows.map(renderRow).join('');
        })
        .withFailureHandler(function(e){ fillError('Could not read settings: '+(e&&e.message||e)); })
        .getSettingsFor(PAGE);
    }
  }
  window.amrOpenSettings = openSettings;

  /* Delegated handlers for every row's Save / "Use code default". */
  setList.addEventListener('click', function(e){
    var row = e.target.closest ? e.target.closest('.amr-set-row') : null;
    if(!row) return;
    var reloadNow = e.target.closest('.amr-reload-now');
    if(reloadNow){ e.preventDefault(); reloadThisPage(); return; }
    var page   = row.getAttribute('data-page');
    var status = row.querySelector('.amr-row-status');

    var saveBtn = e.target.closest('.amr-save-btn');
    if(saveBtn){
      if(!IS_LIVE) return;
      var val = row.querySelector('.amr-sheet-input').value;
      status.className='amr-status muted amr-row-status'; status.textContent='Saving…'; saveBtn.disabled=true;
      google.script.run.withSuccessHandler(function(r){
        status.className='amr-status ok amr-row-status';
        if(PAGE==='landing'){ status.textContent='Saved “'+(r.name||'sheet')+'”.'; setTimeout(openSettings, 700); return; }
        status.innerHTML='Saved “'+esc(r.name||'sheet')+'”. Reloading with the new sheet… '
          +'<a href="#" class="amr-reload-now" style="color:#0F4FD6;font-weight:700">reload now</a>';
        setModal.classList.remove('amr-open');
        /* Prefer the page's own in-place reload: it re-reads the new sheet AND
           resets the sidebar presets (title, description, latest month) without a
           full navigation. reloadThisPage() used to run first, which started a _top
           navigation and left this hook as dead code. Fall back to it only for
           pages that don't implement the hook. */
        if(typeof window.amrReloadData==='function'){ try{ window.amrReloadData(); return; }catch(e){} }
        reloadThisPage();
      }).withFailureHandler(function(err){
        saveBtn.disabled=false; status.className='amr-status err amr-row-status'; status.textContent=(err&&err.message||err);
      }).saveSpreadsheetId(val, page);

      return;
    }

    var defLink = e.target.closest('.amr-default-link');
    if(defLink){
      e.preventDefault();
      if(!IS_LIVE) return;
      status.className='amr-status muted amr-row-status'; status.textContent='Reverting to code default…';
      google.script.run.withSuccessHandler(function(){
        if(PAGE==='landing'){ openSettings(); return; }
        if(typeof window.amrReloadData==='function'){ try{ window.amrReloadData(); return; }catch(e){} }
        reloadThisPage();
      }).withFailureHandler(function(err){
        status.className='amr-status err amr-row-status'; status.textContent=(err&&err.message||err);
      }).clearSpreadsheetOverride(page);
    }
  });

  /* close buttons + click-outside + Esc */
  [].forEach.call(document.querySelectorAll('[data-close]'),function(x){
    x.onclick=function(){ document.getElementById(x.getAttribute('data-close')).classList.remove('amr-open'); };
  });
  [].forEach.call(document.querySelectorAll('.amr-modal'),function(m){
    m.addEventListener('click',function(e){ if(e.target===m) m.classList.remove('amr-open'); });
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') [].forEach.call(document.querySelectorAll('.amr-modal'),function(m){ m.classList.remove('amr-open'); });
  });

  /* ================== AmrHint : per-table source hints ==================
   * Each page registers a hint once (tab name + column order + a sample row),
   * then drops a "?" button next to each generated table. One delegated click
   * handler opens the shared hint modal (works for tables built after load).
   */
  var HINTS = {};
  window.AmrHint = {
    register: function(key, html){ HINTS[key] = html; },
    btn: function(key){
      return '<button type="button" class="amr-qm" data-amr-hint="'+key+'" '+
        'title="What source data feeds this table" aria-label="Source data hint">?</button>';
    },
    show: function(key){
      document.getElementById('amrHintBody').innerHTML = HINTS[key] || '<p>No source hint available for this table.</p>';
      document.getElementById('amrHintModal').classList.add('amr-open');
    }
  };
  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.amr-qm') : null;
    if(!b) return;
    e.preventDefault();
    window.AmrHint.show(b.getAttribute('data-amr-hint'));
  });
})();
</script>

<script>
/* ==================================================================
 * AmrCache — per-device (localStorage) copy of computed tables.
 * On page open, boot() asks the server for the current DATA VERSION
 * (getDataVersion in Code.gs) and wipes this page's saved tables if
 * it changed since the device's last visit. So pressing "Update from
 * source" anywhere refreshes every device the next time it opens the
 * page — while unchanged data keeps loading instantly, indefinitely.
 * Pages that already receive the version in their first server reply
 * (e.g. RMX getMarkets) can call check(gen) directly instead.
 * ================================================================== */
window.AmrCache = (function(){
  function page(){ return window.APP_PAGE || 'page'; }
  function pfx(){ return 'amrCache:' + page() + ':'; }
  function genKey(){ return 'amrCacheGen:' + page(); }
  function wipe(){
    try{
      var rm = [];
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && k.indexOf(pfx()) === 0) rm.push(k);
      }
      rm.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
  }
  var api = {
    ready: false,   // saved tables are only served after the version is confirmed
    /* Compare the server's data version with the one stored on this
       device; wipe this page's saved tables if it changed. */
    check: function(gen){
      gen = String(gen == null ? '' : gen);
      try{
        if (localStorage.getItem(genKey()) !== gen){ wipe(); localStorage.setItem(genKey(), gen); }
      }catch(e){}
      api.ready = !!gen;
    },
    /* One tiny server call on page open, then hand control back.
       If it fails, the page simply loads normally (no device cache). */
    boot: function(done){
      if (!(typeof google !== 'undefined' && google.script && google.script.run)){ done && done(); return; }
      google.script.run
        .withSuccessHandler(function(r){ api.check(r && r.generation); done && done(); })
        .withFailureHandler(function(){ done && done(); })
        .getDataVersion(page());
    },
    get: function(key){
      if (!api.ready) return null;
      try{ var raw = localStorage.getItem(pfx() + key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
    },
    set: function(key, data){
      if (!api.ready) return;
      try{
        var s = JSON.stringify(data);
        if (s.length > 1500000) return;            // stay well inside the ~5MB quota
        localStorage.setItem(pfx() + key, s);
      }catch(e){
        /* quota full: drop this page's old entries and try once more */
        try{ wipe(); localStorage.setItem(pfx() + key, JSON.stringify(data)); }catch(e2){}
      }
    },
    wipe: wipe
  };
  return api;
})();
</script>

<script>
/* ==================================================================
 * AmrProgress — the ONE background-work indicator, shared by every page.
 * ------------------------------------------------------------------
 * Every page used to throw up a full-screen .loader overlay for work
 * that did not actually need the page frozen, so the suite looked like
 * it was constantly stopping to think. This is the replacement: a small
 * pill, bottom-left, that names what is running and how far along it is
 * while the page stays completely usable underneath.
 *
 *   AmrProgress.set('cube', { text:'Loading months…', pct:62 })
 *   AmrProgress.set('sheet', { text:'Reading the data sheet…' })
 *   AmrProgress.clear('sheet')
 *   AmrProgress.done('cube', 'Everything is in')   // ✓, then fades out
 *   AmrProgress.fail('cube', 'History unavailable')
 *
 * Several jobs can run at once. The pill shows the one with the lowest
 * `order` (default 50); the rest are listed in the popover, so "why is
 * this still spinning" is always one click away.
 *
 * A page that wants a richer popover (the Overview's month history, with
 * its own buttons) registers one:
 *   AmrProgress.detail({ html:function(job){...}, act:function(name){...} })
 * ================================================================== */
window.AmrProgress = (function(){
  var jobs = {}, seq = 0, detail = null, pill = null, pop = null, mounted = false;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  function mount(){
    if (mounted || !document.body) return;
    mounted = true;
    pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'amr-pill';
    pill.id = 'amrPill';
    pill.setAttribute('aria-haspopup', 'dialog');
    pill.setAttribute('aria-expanded', 'false');
    pill.innerHTML = '<span class="ring"></span><span class="amr-txt"></span>';
    pop = document.createElement('div');
    pop.className = 'amr-pop';
    pop.id = 'amrPop';
    pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', 'Background work');
    document.body.appendChild(pill);
    document.body.appendChild(pop);

    pill.addEventListener('click', function(){
      pill.setAttribute('aria-expanded', pill.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
      render();
    });
    pop.addEventListener('click', function(e){
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b || !b.getAttribute('data-act')) return;
      if (detail && detail.act) { try { detail.act(b.getAttribute('data-act')); } catch (err) {} }
    });
    document.addEventListener('click', function(e){
      if (pill.getAttribute('aria-expanded') !== 'true') return;
      if (pill.contains(e.target) || pop.contains(e.target)) return;
      pill.setAttribute('aria-expanded', 'false'); render();
    });
  }

  /* The job the pill actually shows: errors first, then the lowest order,
     then whichever was registered first. A 'done' job only wins when it is
     the only thing left, so a tick never hides live work. */
  function lead(){
    var list = [];
    for (var k in jobs) list.push(jobs[k]);
    if (!list.length) return null;
    var live = list.filter(function(j){ return j.cls !== 'done'; });
    var pool = live.length ? live : list;
    pool.sort(function(a, b){
      if ((a.cls === 'bad') !== (b.cls === 'bad')) return a.cls === 'bad' ? -1 : 1;
      if (a.order !== b.order) return a.order - b.order;
      return a.seq - b.seq;
    });
    return pool[0];
  }

  function render(){
    mount();
    if (!pill) return;
    var j = lead();
    var open = pill.getAttribute('aria-expanded') === 'true';
    if (!j){
      pill.className = 'amr-pill';
      pop.classList.remove('show');
      pill.setAttribute('aria-expanded', 'false');
      return;
    }
    pill.className = 'amr-pill show' + (j.cls ? (' ' + j.cls) : '');
    var txt = pill.querySelector('.amr-txt');
    if (txt) txt.textContent = j.text + (j.pct != null ? ' ' + j.pct + '%' : '');

    if (!open){ pop.classList.remove('show'); return; }

    var html = '';
    if (detail && detail.html){
      try { html = detail.html(j) || ''; } catch (e) { html = ''; }
    }
    if (!html) html = '<b>' + esc(j.text) + '</b>' + (j.note ? '<br>' + esc(j.note) : '');
    if (j.pct != null) html += '<div class="bar"><i style="width:' + j.pct + '%"></i></div>';

    var others = [];
    for (var k in jobs) if (jobs[k] !== j) others.push(jobs[k]);
    if (others.length){
      html += '<ul class="amr-jobs">' + others.map(function(o){
        return '<li><span>' + esc(o.text) + '</span><b>' + (o.pct != null ? o.pct + '%' : '…') + '</b></li>';
      }).join('') + '</ul>';
    }
    pop.innerHTML = html;
    pop.classList.add('show');
  }

  var api = {
    /* o: { text, pct (null|0-100), cls ('', 'bad', 'done'), note, order } */
    set: function(key, o){
      o = o || {};
      var prev = jobs[key];
      jobs[key] = { key: key,
                    text: o.text != null ? o.text : (prev ? prev.text : 'Working…'),
                    pct:  o.pct  != null ? o.pct  : null,
                    cls:  o.cls  || '',
                    note: o.note || '',
                    order: o.order != null ? o.order : (prev ? prev.order : 50),
                    seq:  prev ? prev.seq : (++seq) };
      render();
    },
    clear: function(key){ delete jobs[key]; render(); },
    /* Finished cleanly: tick for a moment, then take the chrome away — no
       standing UI for a solved problem. */
    done: function(key, text, ms){
      if (!jobs[key] && !text) return;
      api.set(key, { text: text || (jobs[key] && jobs[key].text) || 'Done', cls: 'done', pct: null });
      setTimeout(function(){
        if (jobs[key] && jobs[key].cls === 'done') api.clear(key);
      }, ms == null ? 2200 : ms);
    },
    fail: function(key, text){ api.set(key, { text: text || 'Something went wrong', cls: 'bad', pct: null, order: 0 }); },
    has:  function(key){ return !!jobs[key]; },
    /* A page can own the popover body (the Overview's month history does). */
    detail: function(d){ detail = d; render(); },
    repaint: render
  };
  return api;
})();
</script>

<script>
/* ==================================================================
 * AmrKpiStore — per-device store for UPLOADED WORKBOOKS (raw bytes).
 * ------------------------------------------------------------------
 * Why: the browser can't silently re-open a file from the user's disk
 * after a refresh, so instead the file's BYTES are kept on the device
 * (IndexedDB — no practical size limit; localStorage fallback) and
 * every page re-parses them with SheetJS on open.
 *
 * Keys are GLOBAL (not page-prefixed) on purpose: pages that share the
 * same source workbook use the same key, so uploading it once on any
 * page populates every other page that reads that key. Suite keys:
 *
 *   'kpiMain'  → AGG & RMX EBITDA Report (HNS, North, Innocon)
 *   'kpiMbsk'  → Manitoba / Saskatchewan workbook (same layout)
 *
 * API (all callback-based, never throws):
 *   AmrKpiStore.save(key, fileName, arrayBuffer [, cb(ok)])
 *   AmrKpiStore.load(key, cb(rec|null))       rec = {name, ts, buf:ArrayBuffer}
 *   AmrKpiStore.loadAll([keys], cb(map))      map = {key: rec|null, ...}
 *   AmrKpiStore.clear(key [, cb])
 *
 * Typical page wiring:
 *   // on open — restore saved workbooks before first render:
 *   AmrKpiStore.loadAll(['kpiMain','kpiMbsk'], function(m){
 *     if(m.kpiMain) applyMain(XLSX.read(new Uint8Array(m.kpiMain.buf),{type:'array'}), m.kpiMain.name);
 *     if(m.kpiMbsk) applyMbsk(XLSX.read(new Uint8Array(m.kpiMbsk.buf),{type:'array'}), m.kpiMbsk.name);
 *   });
 *   // on upload — AFTER the file parsed successfully:
 *   AmrKpiStore.save('kpiMain', file.name, arrayBuffer);
 * ================================================================== */
window.AmrKpiStore = (function(){
  var DB='amrKpiFiles', ST='files';
  var LS_PFX='amrKpiFile:', LS_MAX=4*1024*1024;   // fallback cap ≈ 4 MB of raw bytes

  function openDb(cb){
    try{
      if(!window.indexedDB){ cb(null); return; }
      var rq=indexedDB.open(DB, 1);
      rq.onupgradeneeded=function(){ try{ rq.result.createObjectStore(ST); }catch(e){} };
      rq.onsuccess=function(){ cb(rq.result); };
      rq.onerror=function(){ cb(null); };
      rq.onblocked=function(){ cb(null); };
    }catch(e){ cb(null); }
  }

  /* ---- base64 helpers for the localStorage fallback ---- */
  function bufToB64(buf){
    var u=new Uint8Array(buf), s='', CH=0x8000;
    for(var i=0;i<u.length;i+=CH) s+=String.fromCharCode.apply(null, u.subarray(i,i+CH));
    return btoa(s);
  }
  function b64ToBuf(b64){
    var s=atob(b64), u=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
    return u.buffer;
  }

  function lsSave(key, rec){
    try{
      if(rec.buf.byteLength>LS_MAX) return false;
      localStorage.setItem(LS_PFX+key, JSON.stringify({name:rec.name, ts:rec.ts, b64:bufToB64(rec.buf)}));
      return true;
    }catch(e){ return false; }
  }
  function lsLoad(key){
    try{
      var raw=localStorage.getItem(LS_PFX+key); if(!raw) return null;
      var o=JSON.parse(raw);
      return {name:o.name, ts:o.ts, buf:b64ToBuf(o.b64)};
    }catch(e){ return null; }
  }
  function lsClear(key){ try{ localStorage.removeItem(LS_PFX+key); }catch(e){} }

  var api={
    save: function(key, name, buf, cb){
      var rec={name:String(name||''), ts:Date.now(), buf:buf};
      openDb(function(db){
        if(!db){ var ok=lsSave(key, rec); cb&&cb(ok); return; }
        try{
          var tx=db.transaction(ST,'readwrite');
          tx.objectStore(ST).put(rec, key);
          tx.oncomplete=function(){ lsClear(key); cb&&cb(true); };
          tx.onerror=function(){ var ok=lsSave(key, rec); cb&&cb(ok); };
        }catch(e){ var ok2=lsSave(key, rec); cb&&cb(ok2); }
      });
    },
    load: function(key, cb){
      openDb(function(db){
        if(!db){ cb(lsLoad(key)); return; }
        try{
          var rq=db.transaction(ST,'readonly').objectStore(ST).get(key);
          rq.onsuccess=function(){ cb(rq.result || lsLoad(key)); };
          rq.onerror=function(){ cb(lsLoad(key)); };
        }catch(e){ cb(lsLoad(key)); }
      });
    },
    loadAll: function(keys, cb){
      var out={}, left=keys.length;
      if(!left){ cb(out); return; }
      keys.forEach(function(k){
        api.load(k, function(rec){ out[k]=rec; if(--left===0) cb(out); });
      });
    },
    clear: function(key, cb){
      lsClear(key);
      openDb(function(db){
        if(!db){ cb&&cb(); return; }
        try{
          var tx=db.transaction(ST,'readwrite');
          tx.objectStore(ST).delete(key);
          tx.oncomplete=function(){ cb&&cb(); };
          tx.onerror=function(){ cb&&cb(); };
        }catch(e){ cb&&cb(); }
      });
    }
  };
  return api;
})();
</script>

<script>
/* =========================================================================
 * ⇣ PULL FROM QLIKVIEW — shared by every page.
 * -------------------------------------------------------------------------
 * Any button carrying data-qlik-scope is wired here, so each tool gets the
 * same behaviour without its own copy of this code:
 *
 *   data-qlik-scope="pricevolume"   the Aggregates tabs
 *   data-qlik-scope="rmx"           the Ready-Mix raw tabs
 *   data-qlik-scope="segment"       the Slide Builder tabs
 *   data-qlik-scope="all"           everything
 *
 * QlikSync.gs opens the Drive folder(s), works out which export is which from
 * what is inside it, and replaces the data in the Google Sheet. It ends by
 * bumping every data version, so the page is reloaded afterwards to pick the
 * new data up — that is simpler and more certain than re-fetching in place.
 * ======================================================================= */
window.AmrQlik = (function(){

  function run(scope, cb){
    google.script.run
      .withSuccessHandler(function(res){ cb(res || { ok:false, error:'No answer came back.' }); })
      .withFailureHandler(function(e){ cb({ ok:false, error:(e && e.message) ? e.message : String(e) }); })
      .qlikSyncNow(scope || 'all');
  }

  /* One line summarising what happened, for the pill and the status line.
     A run that ran out of time is not a failure with nothing to show: it says
     what it did land before stopping, so the tabs already updated are not
     mistaken for lost work. */
  function summary(res){
    if (!res.ok && res.error){
      var got = (res.done || []).length;
      return res.error + (got ? ' (' + got + ' tab' + (got === 1 ? '' : 's') +
                                ' updated before it stopped.)' : '');
    }
    var n = (res.done || []).length;
    var t = n + ' tab' + (n === 1 ? '' : 's') + ' updated';
    var r = 0;
    (res.done || []).forEach(function(d){ r += (d.rows || 0); });
    if (r) t += ' \u00b7 ' + r.toLocaleString() + ' rows';
    if (res.failed && res.failed.length) t += ' \u00b7 ' + res.failed.length + ' failed';
    return t;
  }

  function wire(){
    var btns = document.querySelectorAll('[data-qlik-scope]');
    Array.prototype.forEach.call(btns, function(btn){
      if (btn.getAttribute('data-qlik-wired')) return;
      btn.setAttribute('data-qlik-wired', '1');

      btn.addEventListener('click', function(){
        var scope = btn.getAttribute('data-qlik-scope') || 'all';
        if (btn.disabled) return;
        btn.disabled = true;
        btn.classList.add('busy');
        if (window.AmrProgress) {
          AmrProgress.set('qlik', { text:'Reading the QlikView exports\u2026', order:0 });
        }

        run(scope, function(res){
          btn.disabled = false;
          btn.classList.remove('busy');

          if (!res.ok){
            if (window.AmrProgress) {
              AmrProgress.set('qlik', { text:'QlikView update failed', cls:'bad', order:0,
                                        note: summary(res) });
            } else {
              alert('QlikView update failed\n\n' + summary(res));
            }
            return;
          }
          if (window.AmrProgress) {
            AmrProgress.set('qlik', { text: summary(res), cls:'done', order:0 });
          }
          /* every cached copy is now stale — come back with the new data */
          setTimeout(function(){ window.location.reload(); }, 600);
        });
      });
    });
  }

  if (document.readyState !== 'loading') wire();
  else document.addEventListener('DOMContentLoaded', wire);

  return { run: run, summary: summary, wire: wire };
})();
</script>
