<!-- ============================================================= -->
<!-- Styles.html — the ONE shared stylesheet for every page.       -->
<!--                                                               -->
<!-- Pulled into a page with  <?!= include('Styles') ?>  in <head>.-->
<!-- It holds: the Amrize colour tokens, the base reset, and every -->
<!-- UI component that more than one page uses (buttons, panels,   -->
<!-- form controls, cards, tables, badges, the loading overlay,    -->
<!-- the landing-page cards…). Each page's own <style> block now    -->
<!-- only keeps the handful of rules unique to that page.          -->
<!--                                                               -->
<!-- Colours come straight from the Amrize theme (navy #011E6A).   -->
<!-- ============================================================= -->
<style>
/* ---------- Amrize design tokens (single source of truth) ---------- */
:root{
  /* Blue ramp — 100 = deepest navy, 10 = palest. Matches the Amrize deck. */
  --blue-100:#011E6A; --blue-90:#0404BD; --blue-80:#0F4FD6; --blue-70:#185CB5;
  --blue-60:#2C74CC;  --blue-50:#2A6EFF; --blue-40:#24A0FF; --blue-30:#5FC0FF;
  --blue-20:#7CD3FF;  --blue-10:#EEF7FF;
  --accent:#2A6EFF;        /* bright icon blue            */
  --accent-light:#7CD3FF;  /* light sky (mark on navy)    */
  --accent-dark:#7CD3FF;   /* alias kept for older markup */
  --ink:#16243B; --muted:#5C6B82; --line:#DCE6F2; --paper:#F4F7FC; --white:#fff;
  --pos:#1F7A4D; --pos-bg:#E4F3EB; --neg:#B23A48; --neg-bg:#F7E7EA;
  --green:#2E7D5B; --pink:#9C4767;    /* RMX table-group accents */
  --r:14px;
  --shadow:0 1px 2px rgba(1,30,106,.06), 0 8px 24px rgba(1,30,106,.07);
}

/* ---------- base reset / typography ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,Arial,sans-serif; color:var(--ink); background:var(--paper);
  font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased}
.num,.tnum{font-variant-numeric:tabular-nums}

/* ---------- top bar + brand (PV & Slide Builder; RMX overrides slightly) ---------- */
header.bar{position:sticky; top:0; z-index:20; background:var(--blue-100); color:#fff;
  display:flex; align-items:center; gap:18px; padding:14px 24px;
  box-shadow:0 1px 0 rgba(255,255,255,.06), 0 6px 20px rgba(1,30,106,.18)}
.brand{display:flex; align-items:baseline; gap:12px}
.brand .mark{font-family:Archivo; font-weight:800; letter-spacing:.22em; font-size:15px;
  color:var(--accent-light); padding-right:12px; border-right:1px solid rgba(255,255,255,.18)}
.brand .title{font-family:Archivo; font-weight:700; font-size:16px; letter-spacing:.01em}
.brand .sub{font-size:12px; color:#A9C3E8; margin-left:2px}
header .spacer{flex:1}

/* ---------- buttons ---------- */
/* .ghost lives on the navy header → outline + white text everywhere. */
.ghost{border:1px solid rgba(255,255,255,.28); background:transparent; color:#fff;
  font:600 12.5px Inter; padding:8px 14px; border-radius:10px; cursor:pointer; transition:.15s}
.ghost:hover{background:rgba(255,255,255,.12)}
.ghost.primary{background:#fff; color:var(--blue-100); border-color:#fff}
.ghost+.ghost{margin-left:8px}
/* small white "download" button used inside light cards */
.dl,.lk{border:1px solid var(--line); background:#fff; color:var(--blue-80); cursor:pointer;
  font:600 11.5px Inter; padding:6px 10px; border-radius:9px; transition:.14s}
.dl:hover,.lk:hover{background:var(--blue-10); border-color:var(--blue-40)}
.lk.full{width:100%}

/* busy spinners: white on the dark header buttons, blue on the light card buttons */
.ghost.busy{position:relative; color:transparent !important}
.ghost.busy::after{content:""; position:absolute; inset:0; margin:auto; width:14px; height:14px;
  border-radius:50%; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; animation:spin .7s linear infinite}
.dl.busy{position:relative; color:transparent !important}
.dl.busy::after{content:""; position:absolute; inset:0; margin:auto; width:14px; height:14px;
  border-radius:50%; border:2px solid var(--blue-20); border-top-color:var(--blue-70); animation:spin .7s linear infinite}

/* ---------- page layout (PV & Slide Builder use .shell/.rail/.main) ---------- */
.shell{display:grid; grid-template-columns:288px 1fr; gap:24px; padding:24px; max-width:1480px; margin:0 auto}
@media (max-width:980px){.shell{grid-template-columns:1fr}}
.rail{position:sticky; top:86px; align-self:start; display:flex; flex-direction:column; gap:18px}
@media (max-width:980px){.rail{position:static}}
.main{display:flex; flex-direction:column; gap:22px; min-width:0}

/* ---------- side-rail panels + form controls ---------- */
.panel{background:var(--white); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.eyebrow{font:700 10.5px Archivo; letter-spacing:.18em; text-transform:uppercase; color:var(--blue-70); margin:0 0 12px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
label.lbl,.lbl{display:block; font:600 12px Inter; color:var(--muted); margin-bottom:6px}
input[type=text],select,.search{width:100%; border:1px solid var(--line); border-radius:10px; background:var(--blue-10);
  padding:9px 12px; font:500 13px Inter; color:var(--ink)}
select{appearance:none; cursor:pointer}
input[type=range]{accent-color:var(--blue-70); width:100%; cursor:pointer; margin:2px 0 0}
.hint{font:500 11.5px Inter; color:var(--muted); margin-top:9px; line-height:1.45}
.btnrow{display:flex; gap:8px}

/* chips (multi-select pills) */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{border:1px solid var(--line); background:#fff; color:var(--ink);
  font:600 12px Inter; padding:7px 11px; border-radius:999px; cursor:pointer; transition:.14s; user-select:none}
.chip:hover{border-color:var(--blue-40)}
.chip[aria-pressed="true"]{background:var(--blue-70); border-color:var(--blue-70); color:#fff}
.chip[disabled]{opacity:.4; cursor:not-allowed}

/* ---------- section headings ---------- */
.section-head{display:flex; align-items:baseline; gap:12px; margin:2px}
.section-head h2{font:700 18px Archivo; margin:0; letter-spacing:.01em}
.section-head .meta{font:500 12px Inter; color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--white); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.card-head{display:flex; align-items:center; gap:10px; padding:16px 18px 0}
.card-head .eb,.eb{font:700 10.5px Archivo; letter-spacing:.16em; text-transform:uppercase; color:var(--blue-70)}
.card-head h3,h3{font:700 15.5px Archivo; margin:2px 0 0}
.card-head .cap{font:500 11.5px Inter; color:var(--muted); margin-top:1px}
.card-head .right{margin-left:auto; display:flex; align-items:center; gap:10px}

/* up/down badge */
.badge{display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px;
  font:700 12.5px Inter; letter-spacing:.01em}
.badge .k{font:700 9.5px Archivo; letter-spacing:.14em; opacity:.7}
.badge.up{background:var(--pos-bg); color:var(--pos)}
.badge.down{background:var(--neg-bg); color:var(--neg)}

/* ---------- generic table ---------- */
table{width:100%; border-collapse:collapse; font-size:13px}
thead th{background:var(--blue-80); color:#fff; font:600 11px Inter; letter-spacing:.04em; text-transform:uppercase;
  padding:10px 12px; text-align:left; white-space:nowrap}
tbody td{padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
tbody td:first-child{text-align:left; font-weight:600; color:var(--ink)}
tbody tr:hover{background:var(--blue-10)}
tfoot td{padding:12px; text-align:right; font-weight:700; border-top:2px solid var(--blue-100)}
tfoot td:first-child{text-align:left}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.empty{padding:40px; text-align:center; color:var(--muted); font:500 13px Inter}

/* ---------- info banner ---------- */
.banner{display:none; align-items:center; gap:10px; background:var(--blue-10); border:1px solid var(--blue-20);
  color:var(--blue-90); font:600 12.5px Inter; padding:10px 14px; border-radius:12px}
.banner.show{display:flex}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* ---------- loading overlay ---------- */
.loader{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
  background:rgba(244,247,252,.62); backdrop-filter:blur(1px)}
.loader.show{display:flex}
.loader .lwrap{display:flex; flex-direction:column; align-items:center; gap:13px}
.spinner{width:42px; height:42px; border-radius:50%;
  border:3px solid var(--blue-20); border-top-color:var(--blue-70); animation:spin .8s linear infinite}
.loader .ltext,.ltext{font:600 12.5px Inter; letter-spacing:.02em; color:var(--blue-90)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spinner{animation-duration:1.8s} }

/* ============================================================= */
/* Landing page                                                  */
/* ============================================================= */
.land-hero{background:var(--blue-100);color:#fff;padding:54px 24px 64px}
.land-hero .inner{max-width:1080px;margin:0 auto}
.land-hero .mark{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:.22em;
  font-size:14px;color:var(--accent-light)}
.land-hero h1{font:800 30px Archivo,sans-serif;margin:10px 0 6px;letter-spacing:.01em}
.land-hero p{font:500 14px Inter;color:#A9C3E8;margin:0;max-width:620px;line-height:1.5}
.land-wrap{max-width:1080px;margin:-34px auto 40px;padding:0 24px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:820px){.land-wrap{grid-template-columns:1fr}}
.land-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:22px;text-decoration:none;color:inherit;
  transition:transform .14s, box-shadow .14s}
.land-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(1,30,106,.14)}
.land-card .tag{font:700 10px Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-70)}
.land-card h2{font:700 18px Archivo,sans-serif;margin:8px 0 6px}
.land-card p{font:500 12.5px Inter;color:var(--muted);line-height:1.5;margin:0 0 16px;flex:1}
.land-card .go{font:700 12.5px Inter;color:var(--blue-100);display:inline-flex;align-items:center;gap:6px}
.land-note{max-width:1080px;margin:0 auto 60px;padding:0 24px}
.land-note .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 20px}
.land-note h3{font:700 14px Archivo,sans-serif;margin:0 0 6px}
.land-note p{font:500 12.5px Inter;color:var(--muted);line-height:1.55;margin:0}
.land-setbtn{margin-top:12px;border:1px solid var(--line);background:var(--blue-10);color:var(--blue-100);
  font:700 12.5px Inter;padding:9px 14px;border-radius:10px;cursor:pointer}
.land-setbtn:hover{border-color:var(--blue-40)}

/* ===================================================================
   AmrProgress — the one background-work indicator, shared by every page.
   Bottom-left, never blocks the page: work is visible but the UI stays
   usable while the numbers fill in. Replaces the full-screen .loader
   overlay for anything that is not an outright modal wait.
   =================================================================== */
/* ---------- the shared loading screen (AmrProgress) ----------
   Full screen, centred, over a blurred page. It used to be a small pill in
   the corner, which was easy to miss — people read half-loaded tables without
   realising anything was still coming. */
.amr-load{position:fixed; inset:0; z-index:9000; display:none; align-items:center;
  justify-content:center; padding:24px; background:rgba(244,247,252,.72);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
.amr-load.show{display:flex}
.amr-load-card{background:#fff; border:1px solid var(--line); border-radius:16px;
  box-shadow:0 24px 60px rgba(1,30,106,.22); padding:28px 30px; min-width:280px;
  max-width:420px; width:100%; text-align:center}
.amr-load-mark{width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
  border:3px solid var(--blue-10); border-top-color:var(--blue-70);
  animation:amrload .8s linear infinite}
@keyframes amrload{to{transform:rotate(360deg)}}
.amr-load-mark.done{border:0; background:var(--pos); animation:none; position:relative}
.amr-load-mark.done::after{content:"\2713"; position:absolute; inset:0; color:#fff;
  font:700 19px/34px Inter; text-align:center}
.amr-load-mark.bad{border:0; background:var(--neg); animation:none; position:relative}
.amr-load-mark.bad::after{content:"!"; position:absolute; inset:0; color:#fff;
  font:700 20px/34px Inter; text-align:center}
.amr-load-text{font:700 14.5px Archivo,sans-serif; color:var(--blue-100)}
.amr-load.bad .amr-load-text{color:var(--neg)}
.amr-load-sub{font:500 12px Inter; color:var(--muted); margin-top:7px; line-height:1.5}
.amr-load-detail{font:400 12.5px Inter; color:var(--ink); margin-top:11px; text-align:left; line-height:1.5}
.amr-load-detail b{color:var(--blue-100)}
.amr-load-detail .acts{display:flex; gap:7px; margin-top:12px}
.amr-load-detail .acts button{flex:1; border:1px solid var(--line); background:#fff;
  color:var(--blue-100); font:700 11.5px Inter; padding:8px 10px; border-radius:8px; cursor:pointer}
.amr-load-detail .acts button:hover{border-color:var(--blue-40); background:var(--blue-10)}
.amr-load-bar{height:6px; border-radius:3px; background:var(--blue-10); margin:14px 0 0; overflow:hidden}
.amr-load-bar i{display:block; height:100%; background:var(--blue-70); border-radius:3px; transition:width .3s}
.amr-load-jobs{margin:14px 0 0; padding:12px 0 0; list-style:none; border-top:1px solid var(--line)}
.amr-load-jobs li{display:flex; justify-content:space-between; gap:10px;
  font:600 11.5px Inter; color:var(--muted); padding:3px 0}
@media (prefers-reduced-motion:reduce){ .amr-load-mark{animation-duration:2.4s} }

/* Panels waiting on background work: a quiet line, never an empty box. */
.amr-waiting{font:600 11.5px Inter; color:var(--muted); padding:14px 0}
</style>
