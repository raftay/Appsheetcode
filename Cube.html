<!-- ===========================================================================
     AmrCube — the month fact table, in the browser.
     Extracted from Page_Overview so the Price & Volume and Ready-Mix pages can
     query the same cube instead of each round-tripping to the server. Include
     it with <?!= include('Cube') ?> AFTER Shell, then call AmrCube.init().

     Column layout is read from the manifest (man.dims / man.vals), never
     hardcoded, so a shape change on the server needs nothing here.
     =========================================================================== -->
<script>
/* ===========================================================================
 * AmrCube — the Overview's month cube, client side
 * ---------------------------------------------------------------------------
 * Holds the fact table in typed arrays and answers every question locally, so
 * changing month, market or a cross-filter costs a linear scan (a few ms) and
 * never a server round trip.
 *
 * WHY INDEXEDDB AND NOT AmrCache
 *   The cube is a few MB. localStorage is 5-10 MB per origin AND stores UTF-16,
 *   so a 5 MB payload occupies ~10 MB and Safari evicts it anyway. IndexedDB
 *   has no practical ceiling here and takes structured clones, so a warm start
 *   re-reads the chunks with no JSON.parse at all. AmrCache keeps doing what it
 *   already does for the small payloads; this is deliberately separate.
 *
 * LOADING SHAPE
 *   Nothing here blocks the page, and the cube goes FIRST rather than last:
 *   it is what makes every later interaction local, so queueing it behind the
 *   server reports meant paying for both.
 *
 *   1. WARM START. If IndexedDB already holds a manifest and its blocks, they
 *      are replayed straight away — zero round trips, numbers on screen
 *      immediately — and the generation is confirmed afterwards. If it moved,
 *      the store is wiped and the cube rebuilds. Same paint-then-revalidate
 *      the fuel-surcharge panel already uses.
 *   2. COLD START. One manifest call, then the missing month-blocks NEWEST
 *      FIRST, one at a time (Apps Script runs a user's calls end to end, so
 *      parallel buys nothing).
 *
 *   Two things decide the order: configure({lines}) drops the business line a
 *   page never asks about (Price & Volume needs no Ready-Mix rows), and
 *   configure({priority}) puts the tab you are looking at in front, so the
 *   visible half of the Overview fills in while the other half is still coming.
 *
 *   A section switches from the server to the cube the moment the cube holds
 *   every month that section needs — that is the whole readiness rule.
 *
 * PPI
 *   Weights are recomputed from plant x material (RMX: plant x mix) rows on
 *   every query, so PPI is EXACT for any market subset instead of the
 *   revenue-weighted blend the cards fall back to. Coverage floors arrive in
 *   the manifest (Qlik parity: RMX volume > 1 and revenue > 110); they are not
 *   hard-coded here so a change is one edit in Config.gs.
 * ========================================================================= */
window.AmrCube = (function(){
  'use strict';

  var DB_NAME = 'amrize_cube', DB_VER = 1, STORES = ['agg', 'rmx'];
  var LIVE = (typeof google !== 'undefined' && google.script && google.script.run);

  var S = {                       // per line
    agg: { man:null, chunks:{}, cols:null, n:0, ready:false },
    rmx: { man:null, chunks:{}, cols:null, n:0, ready:false }
  };
  var gen = null, db = null, listeners = [], booting = false;
  /* Which lines this page actually cares about, and which one to fetch first.
     Overview wants both; Price & Volume only agg; Ready-Mix only rmx. */
  var LINES = STORES.slice(), PRIORITY = null, warm = false;

  function emit(ev, payload){
    for (var i = 0; i < listeners.length; i++){
      try { listeners[i](ev, payload); } catch (e) {}
    }
  }

  /* ---------------------------------------------------------- IndexedDB -- */
  function idbOpen(){
    return new Promise(function(res){
      if (!window.indexedDB) return res(null);
      var rq;
      try { rq = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return res(null); }
      rq.onupgradeneeded = function(){
        var d = rq.result;
        STORES.concat('meta').forEach(function(s){
          if (!d.objectStoreNames.contains(s)) d.createObjectStore(s);
        });
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror   = function(){ res(null); };       // no IndexedDB -> memory only, still works
    });
  }
  function idbGet(store, key){
    return new Promise(function(res){
      if (!db) return res(null);
      try {
        var rq = db.transaction(store, 'readonly').objectStore(store).get(key);
        rq.onsuccess = function(){ res(rq.result || null); };
        rq.onerror   = function(){ res(null); };
      } catch (e) { res(null); }
    });
  }
  function idbPut(store, key, val){
    return new Promise(function(res){
      if (!db) return res(false);
      try {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val, key);
        tx.oncomplete = function(){ res(true); };
        tx.onerror    = function(){ res(false); };
      } catch (e) { res(false); }
    });
  }
  function idbWipe(){
    return new Promise(function(res){
      if (!db){ return res(); }
      try {
        var tx = db.transaction(STORES.concat('meta'), 'readwrite');
        STORES.concat('meta').forEach(function(s){ tx.objectStore(s).clear(); });
        tx.oncomplete = function(){ res(); };
        tx.onerror    = function(){ res(); };
      } catch (e) { res(); }
    });
  }

  /* -------------------------------------------------------------- decode -- */
  /* Columnar JSON -> typed arrays. Dim codes are small ints (Int32Array),
     measures are money and tonnes (Float64Array). ~5 MB of JSON lands as ~3 MB
     of buffers, and a full scan of 90k rows is single-digit milliseconds. */
  function ingest(line, chunk){
    var st = S[line], man = st.man;
    if (!man || !chunk || !chunk.cols) return;
    if (st.chunks[chunk.i]) return;                          // already have it
    var cols = chunk.cols, n = (cols.ym || []).length;
    var fields = ['ym'].concat(man.dims).concat(man.vals);

    if (!st.cols){
      st.cols = {};
      fields.forEach(function(f){ st.cols[f] = []; });
    }
    var block = {};
    fields.forEach(function(f){
      var src = cols[f] || [];
      var arr = (man.vals.indexOf(f) !== -1) ? new Float64Array(n) : new Int32Array(n);
      for (var i = 0; i < n; i++) arr[i] = src[i] || 0;
      block[f] = arr;
    });
    fields.forEach(function(f){ st.cols[f].push(block[f]); });
    st.chunks[chunk.i] = { rows: n, from: chunk.from, to: chunk.to };
    st.n += n;
    st.months = null;                                        // invalidate the month index
  }

  /* Iterate every loaded block without flattening (flattening would double the
     memory for no gain — the scan is per-block anyway). */
  function eachBlock(line, fn){
    var st = S[line];
    if (!st.cols) return;
    var blocks = st.cols.ym.length;
    for (var b = 0; b < blocks; b++){
      var view = {};
      var fields = ['ym'].concat(st.man.dims).concat(st.man.vals);
      for (var f = 0; f < fields.length; f++) view[fields[f]] = st.cols[fields[f]][b];
      fn(view, view.ym.length);
    }
  }

  function months(line){
    var st = S[line];
    if (!st.cols) return [];
    if (st.months) return st.months;
    var seen = {};
    eachBlock(line, function(v, n){ for (var i = 0; i < n; i++) seen[v.ym[i]] = 1; });
    st.months = Object.keys(seen).map(Number).sort(function(a, b){ return a - b; });
    return st.months;
  }

  /* Readiness is per QUESTION, not global: a section goes local the moment the
     cube holds every month it needs. MTD needs 2, YTD up to 16, a 24M chart 48. */
  function has(line, ymList){
    var m = months(line), set = {};
    for (var i = 0; i < m.length; i++) set[m[i]] = 1;
    for (var j = 0; j < ymList.length; j++) if (!set[ymList[j]]) return false;
    return true;
  }

  /* --------------------------------------------------------------- masks -- */
  /* A filter becomes a byte mask indexed by dictionary code, so the inner loop
     is an array lookup rather than a string compare. Derived dimensions
     (market, submarket, Land/Docks, strength/class/application) resolve onto a
     PLANT or MIX mask, because that is what the rows actually carry. */
  function maskOf(list, values){
    var m = new Uint8Array(list.length), want = {}, any = false;
    for (var i = 0; i < values.length; i++){ want[String(values[i])] = 1; any = true; }
    if (!any) return null;
    for (var j = 0; j < list.length; j++) if (want[list[j]]) m[j] = 1;
    return m;
  }
  function derivedMask(man, viaArr, dictName, values){
    var codes = maskOf(man.dict[dictName] || [], values);
    if (!codes) return null;
    var m = new Uint8Array(viaArr.length);
    for (var i = 0; i < viaArr.length; i++) m[i] = codes[viaArr[i]] ? 1 : 0;
    return m;
  }

  var VIA_PLANT_AGG = { market:'market', submarket1:'sm1', submarket2:'sm2', mb:'mb' };
  var VIA_PLANT_RMX = { market:'market', submarket:'submarket' };
  var VIA_MIX_RMX   = { strength:'strength', cls:'cls', app:'app' };

  function buildMasks(line, filters){
    var man = S[line].man, out = { direct:{}, plant:null, mix:null };
    filters = filters || {};
    var plantMasks = [], mixMasks = [];

    Object.keys(filters).forEach(function(k){
      var vals = filters[k];
      if (!vals || !vals.length) return;

      if (man.dims.indexOf(k) !== -1){                       // a real column
        var m = maskOf(man.dict[k] || [], vals);
        if (m) out.direct[k] = m;
        return;
      }
      var viaP = (line === 'agg') ? VIA_PLANT_AGG[k] : VIA_PLANT_RMX[k];
      if (viaP && man.plantMap && man.plantMap[viaP]){
        var pm = derivedMask(man, man.plantMap[viaP], viaP, vals);
        if (pm) plantMasks.push(pm);
        return;
      }
      var viaM = (line === 'rmx') ? VIA_MIX_RMX[k] : null;
      if (viaM && man.mixMap && man.mixMap[viaM]){
        var mm = derivedMask(man, man.mixMap[viaM], viaM, vals);
        if (mm) mixMasks.push(mm);
      }
    });

    function combine(list, len){
      if (!list.length) return null;
      var m = new Uint8Array(len);
      for (var i = 0; i < len; i++){
        var ok = 1;
        for (var j = 0; j < list.length; j++) if (!list[j][i]){ ok = 0; break; }
        m[i] = ok;
      }
      return m;
    }
    out.plant = combine(plantMasks, (man.dict.plant || []).length);
    out.mix   = combine(mixMasks,   (man.dict.mix   || []).length);
    return out;
  }

  /* --------------------------------------------------------------- query -- */
  /* One pass produces the group sums AND the plant|material sub-index PPI needs,
     so coverage is re-applied to exactly what the selection collapses to —
     which is what makes a whole-year selection behave like YTD rather than an
     average of monthly indices. */
  function query(o){
    o = o || {};
    var line = (o.line === 'rmx') ? 'rmx' : 'agg';
    var st = S[line], man = st.man;
    if (!man || !st.cols) return null;

    var isAgg = (line === 'agg');
    /* cyMonths and pyMonths are INDEX-ALIGNED: pyMonths[i] is the month
       cyMonths[i] is compared against. `slot` maps both onto the current-year
       month so a groupBy:'ym' series has ONE point per comparison rather than
       two half-empty ones (the CY row and its PY row must land together or
       every point computes a PPI of zero). */
    /* A rolling window makes these lists OVERLAP: in a 24-month view Jul-2025 is
       both a month in its own right and Jul-2026's comparison. The old code kept
       ONE slot per month and one branch per row, so whichever role was written
       last silently swallowed the other and every overlapping month lost its
       prior-year side. Two independent slot maps, and a row is counted in each
       role it holds. */
    var cyList = o.cyMonths || [], pyList = o.pyMonths || [];
    var cySlot = {}, pySlot = {};
    cyList.forEach(function(m){ cySlot[m] = m; });
    pyList.forEach(function(m, i){ pySlot[m] = (cyList[i] !== undefined) ? cyList[i] : m; });

    var masks = buildMasks(line, o.filters);
    var groupBy = o.groupBy || null;
    var cov = o.coverage || man.coverage || { minVol:0, minRev:0 };

    /* group key -> { sums, pairs{plant|item: [cyV,pyV,cyR,pyR]} } */
    var G = {}, order = [];
    function bucket(key){
      var g = G[key];
      if (!g){ g = G[key] = { key:key, cyVol:0, pyVol:0, cyRev:0, pyRev:0, cyFsc:0, pyFsc:0,
                            cyFv:0, pyFv:0, cyEx:0, pyEx:0, cyVa:0, pyVa:0, pairs:{} }; order.push(key); }
      return g;
    }
    var groupVia = null, groupDirect = null;
    if (groupBy === 'ym') groupVia = 'ym';
    else if (groupBy && man.dims.indexOf(groupBy) !== -1) groupDirect = groupBy;
    else if (groupBy){
      var vP = isAgg ? VIA_PLANT_AGG[groupBy] : VIA_PLANT_RMX[groupBy];
      var vM = !isAgg ? VIA_MIX_RMX[groupBy] : null;
      if (vP) groupVia = { on:'plant', map: man.plantMap[vP], dict: man.dict[vP] };
      else if (vM) groupVia = { on:'mix', map: man.mixMap[vM], dict: man.dict[vM] };
    }

    eachBlock(line, function(v, n){
      var vv = v[man.vals[0]], vr = v[man.vals[1]];
      /* new in shape v2: agg carries applied-surcharge volume (fv); rmx carries
         extras and VAP revenue, so all-in ASP is a local sum. Guarded so a
         block built before the shape bump simply reports zero. */
      var vf  = isAgg ? (v.fsc || null) : null;
      var vfv = isAgg ? (v.fv  || null) : null;
      var vex = isAgg ? null : (v.ex || null);
      var vva = isAgg ? null : (v.va || null);
      var itemCol = isAgg ? v.material : v.mix;
      for (var i = 0; i < n; i++){
        var ym = v.ym[i];
        var cSlot = cySlot[ym], pSlot = pySlot[ym];
        if (cSlot === undefined && pSlot === undefined) continue;

        var p = v.plant[i];
        if (masks.plant && !masks.plant[p]) continue;
        if (masks.mix && !masks.mix[v.mix[i]]) continue;
        var skip = false;
        for (var d in masks.direct){ if (!masks.direct[d][v[d][i]]){ skip = true; break; } }
        if (skip) continue;

        var pkey = p + '|' + itemCol[i];
        function keyFor(s){
          if (groupVia === 'ym') return s;
          if (groupDirect) return man.dict[groupDirect][v[groupDirect][i]];
          if (groupVia) return groupVia.dict[groupVia.map[groupVia.on === 'plant' ? p : v.mix[i]]];
          return '\u0001all';
        }
        function pairOf(g){
          var pr = g.pairs[pkey];
          if (!pr) pr = g.pairs[pkey] = [0, 0, 0, 0];
          return pr;
        }
        if (cSlot !== undefined){
          var gc = bucket(keyFor(cSlot)), prc = pairOf(gc);
          gc.cyVol += vv[i]; gc.cyRev += vr[i];
          if (vf)  gc.cyFsc += vf[i];
          if (vfv) gc.cyFv  += vfv[i];
          if (vex) gc.cyEx  += vex[i];
          if (vva) gc.cyVa  += vva[i];
          prc[0] += vv[i]; prc[2] += vr[i];
        }
        if (pSlot !== undefined){
          var gp = bucket(keyFor(pSlot)), prp = pairOf(gp);
          gp.pyVol += vv[i]; gp.pyRev += vr[i];
          if (vf)  gp.pyFsc += vf[i];
          if (vfv) gp.pyFv  += vfv[i];
          if (vex) gp.pyEx  += vex[i];
          if (vva) gp.pyVa  += vva[i];
          prp[1] += vv[i]; prp[3] += vr[i];
        }
      }
    });

    var mv = cov.minVol || 0, mr = cov.minRev || 0;
    var rows = order.map(function(k){
      var g = G[k], w = 0, f = 0;
      for (var pk in g.pairs){
        var o2 = g.pairs[pk];
        if (!(o2[0] > 0 && o2[1] > 0 && o2[2] > 0 && o2[3] > 0)) continue;   // the app's own coverage
        if (!(o2[0] > mv && o2[1] > mv && o2[2] > mr && o2[3] > mr)) continue; // Qlik's floors
        var pyAsp = o2[3] / o2[1], cyAsp = o2[2] / o2[0];
        f += o2[2] * ((cyAsp - pyAsp) / pyAsp);
        w += o2[2];
      }
      delete g.pairs;                                  // don't hand the caller the scratch index
      g.cyAsp = g.cyVol ? g.cyRev / g.cyVol : 0;
      g.pyAsp = g.pyVol ? g.pyRev / g.pyVol : 0;
      g.aspPct = g.pyAsp ? (g.cyAsp - g.pyAsp) / g.pyAsp : 0;
      g.volPct = g.pyVol ? (g.cyVol - g.pyVol) / g.pyVol : 0;
      g.ppiW = w; g.ppiF = f;
      /* Qlik re-applies the same floors to the displayed row, so a row that is
         itself too small shows no index rather than a noisy one. */
      var okRow = (g.cyVol > mv && g.pyVol > mv && g.cyRev > mr && g.pyRev > mr);
      g.ppi = (w && okRow && g.cyRev > 0 && g.pyRev > 0) ? f / w : 0;
      return g;
    });
    if (groupVia === 'ym') rows.sort(function(a, b){ return a.key - b.key; });
    return groupBy ? rows : (rows[0] || null);
  }

  /* ---------------------------------------------------------------- load -- */
  function call(fn, arg){
    return new Promise(function(res, rej){
      if (!LIVE) return rej(new Error('not live'));
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg);
    });
  }

  function progress(){
    var done = 0, total = 0;
    LINES.forEach(function(l){
      var st = S[l];
      if (!st.man) return;
      total += st.man.chunks.length;
      done  += Object.keys(st.chunks).length;
    });
    return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0,
             warm: warm };
  }

  /* Page setup, before init(). Both keys are optional.
       lines:    ['agg'] — never fetch or build the other line
       priority: 'rmx'   — fetch this line's blocks first                     */
  function configure(o){
    o = o || {};
    if (o.lines && o.lines.length){
      LINES = STORES.filter(function(l){ return o.lines.indexOf(l) !== -1; });
      if (!LINES.length) LINES = STORES.slice();
    }
    if (o.priority && STORES.indexOf(o.priority) !== -1) PRIORITY = o.priority;
    return api;
  }
  /* Switching tab on the Overview re-orders whatever is still outstanding. */
  function prioritise(line){
    if (STORES.indexOf(line) === -1) return;
    PRIORITY = line;
  }

  /* Newest blocks first, both lines interleaved, the priority line leading.
     The old order was every agg block then every rmx block, so opening the
     Ready-Mix tab meant waiting out the whole Aggregates cube first. */
  function jobList(){
    var lead = (PRIORITY && LINES.indexOf(PRIORITY) !== -1) ? PRIORITY : LINES[0];
    var order = [lead].concat(LINES.filter(function(l){ return l !== lead; }));
    var max = 0;
    order.forEach(function(l){
      var st = S[l];
      if (st.man && st.man.chunks.length > max) max = st.man.chunks.length;
    });
    var jobs = [];
    for (var i = 0; i < max; i++){
      order.forEach(function(l){
        var st = S[l];
        if (st.man && st.man.chunks[i]) jobs.push({ line: l, i: st.man.chunks[i].i });
      });
    }
    return jobs;
  }

  /* Take a manifest payload and install it. Returns true if anything landed. */
  function install(man){
    var any = false;
    LINES.forEach(function(l){
      if (man.lines && man.lines[l]){ S[l].man = man.lines[l]; any = true; }
    });
    if (any) emit('manifest', man);
    return any;
  }

  function init(){
    if (booting || !LIVE) return Promise.resolve(false);
    booting = true;
    return idbOpen().then(function(d){
      db = d;
      /* ---- warm start: paint from what this device already holds ---------
         The manifest is kept in IndexedDB next to the blocks, so a repeat
         visit has everything it needs without asking the server anything.
         The numbers go up straight away and the generation is checked behind
         them; if someone has pressed "Update from source" since, the store is
         wiped and the cube rebuilds a second later. */
      return Promise.all([idbGet('meta', 'gen'), idbGet('meta', 'man')]);
    }).then(function(hit){
      var oldGen = hit[0], oldMan = hit[1];
      if (oldGen && oldMan && oldMan.gen === oldGen){
        gen = oldGen;
        if (install(oldMan)){
          warm = true;
          return replayLocal().then(revalidate);
        }
      }
      return coldStart();
    }).catch(function(e){
      emit('error', e && e.message ? e.message : String(e));
      return false;
    });
  }

  /* No usable copy on the device: manifest, then blocks. */
  function coldStart(){
    return call('CUBE_getManifest', { lines: LINES }).then(function(man){
      if (!man || !man.ok) throw new Error((man && man.errors) ? JSON.stringify(man.errors) : 'no manifest');
      return adoptGen(man).then(function(){
        install(man);
        return replayThenFetch();
      });
    });
  }

  /* Warm path: confirm the generation once the screen is already populated.
     Unchanged is the common case and costs one call; changed wipes and rebuilds. */
  function revalidate(){
    return call('CUBE_getManifest', { lines: LINES }).then(function(man){
      if (!man || !man.ok) return true;                 // keep the warm copy
      if (man.gen === gen){
        install(man);
        return replayThenFetch();                       // fill any block still missing
      }
      emit('stale', man.gen);
      return reload();
    }).catch(function(){ return true; });               // offline: the warm copy stands
  }

  function adoptGen(man){
    gen = man.gen;
    return idbGet('meta', 'gen').then(function(old){
      /* "Update from source" on ANY base page, or a history rebuild, changes
         the token and strands the whole store at once — nothing to enumerate. */
      if (old && old !== gen) return idbWipe();
    }).then(function(){
      return idbPut('meta', 'gen', gen);
    }).then(function(){
      return idbPut('meta', 'man', man);                // so the NEXT visit is warm
    });
  }

  /* Everything this device already holds, and nothing else — no server calls
     at all. This is what makes a repeat visit paint immediately. */
  function replayLocal(){
    var jobs = jobList(), seq = Promise.resolve();
    jobs.forEach(function(j){
      seq = seq.then(function(){
        if (S[j.line].chunks[j.i]) return;
        return idbGet(j.line, gen + '|' + j.i).then(function(hit){
          if (!hit) return;
          ingest(j.line, hit);
          emit('progress', progress());
        });
      });
    });
    return seq.then(function(){
      LINES.forEach(function(l){ S[l].ready = !!S[l].cols; });
      emit('warm', progress());
      return true;
    });
  }

  /* Replay whatever IndexedDB already holds (instant, no transfer), then pull
     only what is missing — newest month-block first, priority line leading,
     one call at a time. The job list is rebuilt at every step so switching tab
     mid-load re-orders what has not been fetched yet. */
  function replayThenFetch(){
    var seen = {};
    function nextJob(){
      var jobs = jobList();
      for (var i = 0; i < jobs.length; i++){
        var j = jobs[i], k = j.line + '|' + j.i;
        if (S[j.line].chunks[j.i] || seen[k]) continue;
        seen[k] = 1;
        return j;
      }
      return null;
    }
    function step(){
      var j = nextJob();
      if (!j){
        LINES.forEach(function(l){ S[l].ready = !!S[l].cols; });
        emit('ready', progress());
        return Promise.resolve(true);
      }
      return idbGet(j.line, gen + '|' + j.i).then(function(hit){
        if (hit){ ingest(j.line, hit); emit('progress', progress()); return; }
        return call('CUBE_getChunk', { line:j.line, i:j.i }).then(function(ch){
          if (!ch || !ch.ok || ch.gen !== gen) return;
          ingest(j.line, ch);
          emit('progress', progress());
          return idbPut(j.line, gen + '|' + j.i, ch);
        });
      }).then(step, step);
    }
    return step();
  }

  /* Called after "Load history": the generation token has moved, so every
     manifest, chunk and IndexedDB copy in hand is stale. Drop the lot and boot
     again from scratch. init()'s own gen check wipes the store. */
  function reload(){
    booting = false; gen = null; warm = false;
    STORES.forEach(function(l){ S[l] = { man:null, chunks:{}, cols:null, n:0, ready:false }; });
    /* Straight to the server: the point of a reload is that the device copy is
       known to be wrong, so the warm path would only paint stale numbers. */
    booting = true;
    return idbOpen().then(function(d){ db = d; return idbWipe(); })
      .then(coldStart)
      .catch(function(e){ emit('error', e && e.message ? e.message : String(e)); return false; });
  }

  /* ------------------------------------------------------------- surface -- */
  var api = {
    init: init,
    reload: reload,
    configure: configure,
    prioritise: prioritise,
    lines: function(){ return LINES.slice(); },
    warm: function(){ return warm; },
    on: function(fn){ listeners.push(fn); },
    query: query,
    months: months,
    has: has,
    manifest: function(line){ return S[line] ? S[line].man : null; },
    dict: function(line, name){
      var m = S[line] && S[line].man;
      return (m && m.dict[name]) ? m.dict[name].filter(function(x){ return x !== ''; }) : [];
    },
    unmapped: function(line){ var m = S[line] && S[line].man; return m ? m.unmapped : null; },
    progress: progress,
    ready: function(line){ return line ? S[line].ready : (S.agg.ready && S.rmx.ready); },
    rows: function(line){ return S[line] ? S[line].n : 0; },
    generation: function(){ return gen; }
  };
  return api;
})();

/* NO auto-init. It used to fire 1.2s after the first paint so it would not
   compete with boot(), but Apps Script runs a user's calls one after another,
   so all that did was queue the cube LAST — behind every server report on the
   page, which is exactly what the cube exists to make unnecessary.

   Each page now calls AmrCube.configure({...}).init() itself, first thing in
   its own boot, once it knows which lines and which tab it needs. */
</script>
